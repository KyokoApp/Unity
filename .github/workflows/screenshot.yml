name: screenshot

## ==============================================================
## SCREENSHOT — mem-boot game asli di runner dengan layar maya
## (Xvfb + Mesa software GL), menangkap 4 jepretan nyata, dan
## menyimpannya ke branch ci-logs (pola aditif). Kanal ini dipilih
## karena sandbox dev tidak punya GPU + melarang binary Godot,
## sementara blob artefak Actions tidak bisa diunduh dari sandbox.
## Jepretan mentah PNG dibaca kembali lewat `git show`. (r7)
##
## Trigger: manual (setelah merged ke default) — selama branch
## dev, edit file ini / tests/screenshot_probe.gd memicu run.
## ==============================================================

on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/workflows/screenshot.yml"
      - "tests/screenshot_probe.gd"

permissions:
  contents: write

concurrency:
  group: screenshot
  cancel-in-progress: false

jobs:
  shot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pulihkan aset pengguna dari cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: models
          key: user-assets-v1
          restore-keys: |
            user-assets-

      - name: Pasang layar maya + mesin GL software
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            xvfb libgl1 libglx-mesa0 libgl1-mesa-dri \
            libegl1 libvulkan1 mesa-vulkan-drivers

      - name: Unduh Godot 4.5.1 (binary standar)
        run: |
          GODOT_VER=4.5.1
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_VER}-stable/Godot_v${GODOT_VER}-stable_linux.x86_64.zip" \
               -o /tmp/godot.zip
          unzip -o /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v${GODOT_VER}-stable_linux.x86_64

      - name: Import proyek (dummy, sekali saja)
        run: |
          /tmp/godot-bin/Godot_v4.5.1-stable_linux.x86_64 \
            --headless --path . --import --quit 2>&1 | tail -5

      - name: Boot + jepret 4 screenshot nyata
        run: |
          set -e
          mkdir -p /tmp/shots
          xvfb-run -a -s "-screen 0 1280x720x24" \
            /tmp/godot-bin/Godot_v4.5.1-stable_linux.x86_64 \
            --path . --rendering-method gl_compatibility \
            --rendering-driver opengl3 \
            --script tests/screenshot_probe.gd 2>&1 | tee /tmp/shotlog.txt \
            | grep -E "JEPRET|SCRIPT ERROR|== |boot selesai" || true
          ls -l /tmp/shots/

      - name: Simpan jepretan ke ci-logs (aditif)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.email "arena-bot@local"
          git config user.name "Arena Bot"
          git fetch origin ci-logs || true
          if git show-ref --verify --quiet refs/remotes/origin/ci-logs; then
            git checkout -f -B ci-logs origin/ci-logs
          else
            git checkout --orphan ci-logs
            git rm -rf .
          fi
          rm -f shot1_idle.png shot2_face.png shot3_run.png shot4_attack.png shot5_idle2.png shot6_idle3.png shot7_tpose.png
          for f in shot1_idle shot2_face shot3_run shot4_attack shot5_idle2 shot6_idle3 shot7_tpose; do
            if [ -f "/tmp/shots/$f.png" ]; then
              cp "/tmp/shots/$f.png" .
            fi
          done
          {
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_RUN_ID"
            echo "waktu: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            tail -60 /tmp/shotlog.txt 2>/dev/null || true
          } > screenshot-log.txt
          set +e
          for f in shot1_idle shot2_face shot3_run shot4_attack shot5_idle2 shot6_idle3 shot7_tpose; do
            if [ -f "$f.png" ]; then
              git add "$f.png"
            fi
          done
          set -e
          git add screenshot-log.txt
          git commit -m "ci: jepretan game run $GITHUB_RUN_ID" \
            || echo "tidak ada perubahan"
          for i in 1 2 3; do
            if git push origin ci-logs; then
              break
            fi
            git fetch origin ci-logs
            git rebase origin/ci-logs || git rebase --abort || true
          done
---
