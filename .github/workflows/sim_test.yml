name: sim-test

on:
  workflow_dispatch:

concurrency:
  group: sim-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playmode:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan lisensi Unity
        env:
          UNITY_LICENSE_SECRET: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: bash .github/unity-builder-steps/prepare_license.sh

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-PlayMode-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-PlayMode-
            Library-Android-

      - name: Uji gameplay PlayMode (Unity 2022.3)
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: auto
          testMode: playmode
          artifactsPath: artifacts/sim-tests
          customParameters: -executeMethod CiBuild.PrepSim

      - name: Unggah laporan dan screenshot simulasi
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arpg-sim-test-results
          path: |
            artifacts/sim-tests
            build/simshots
          if-no-files-found: warn
