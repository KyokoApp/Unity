name: Halaman unduh → GitHub Pages

# Menayangkan site/index.html sebagai halaman unduh APK.
# Halaman ini sendiri TIDAK menyimpan APK — ia membaca rilis terbaru
# dari API GitHub, jadi tidak perlu di-deploy ulang setiap kali ada build.
#
# AKTIFKAN SEKALI di GitHub:
#   Settings → Pages → Build and deployment → Source = "GitHub Actions"

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan artefak Pages
        uses: actions/configure-pages@v5

      - name: Unggah
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy ke Pages
        id: deployment
        uses: actions/deploy-pages@v4
