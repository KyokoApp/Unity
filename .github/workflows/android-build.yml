name: Build and Release Android APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Riwayat penuh diperlukan untuk `git diff baseline..HEAD`
          # (pembuatan patch pack incremental).
          fetch-depth: 0

      - name: Tentukan Versi Build
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> $GITHUB_ENV
          echo "PATCH_NAME=patch_1.0.${{ github.run_number }}.pck" >> $GITHUB_ENV
          # Stempel versi ke dalam kode (terlihat di layar boot & overlay debug).
          # File di repo tetap placeholder; perubahan ini hanya ada di working
          # copy CI sehingga tidak ikut menghitung diff patch.
          # Catatan: $GITHUB_ENV baru berlaku di step BERIKUTNYA — di step yang
          # sama variabel shell belum ada, jadi pakai ekspresi Actions langsung.
          printf 'public static class BuildInfo\n{\n\tpublic const string Version = "1.0.%s";\n\tpublic const int VersionCode = %s;\n}\n' \
            "${{ github.run_number }}" "${{ github.run_number }}" > _script/BuildInfo.cs
          cat _script/BuildInfo.cs

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        run: |
          ANDROID_PATH="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_PATH" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_PATH" >> $GITHUB_ENV
          echo "$ANDROID_PATH/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_PATH/platform-tools" >> $GITHUB_PATH
          yes | "$ANDROID_PATH/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_PATH/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Setup Godot Engine Mono & Export Templates
        run: |
          GODOT_VERSION="4.5.1"
          RELEASE_TAG="4.5.1-stable"

          echo "Downloading Godot Mono..."
          curl -fL "https://github.com/godotengine/godot/releases/download/${RELEASE_TAG}/Godot_v${RELEASE_TAG}_mono_linux_x86_64.zip" -o godot_mono.zip
          unzip -q godot_mono.zip -d godot_mono
          sudo mv godot_mono/Godot_v${RELEASE_TAG}_mono_linux_x86_64/Godot_v${RELEASE_TAG}_mono_linux.x86_64 /usr/local/bin/godot
          sudo mv godot_mono/Godot_v${RELEASE_TAG}_mono_linux_x86_64/GodotSharp /usr/local/bin/
          sudo chmod +x /usr/local/bin/godot

          echo "Downloading Godot Export Templates..."
          curl -fL "https://github.com/godotengine/godot/releases/download/${RELEASE_TAG}/Godot_v${RELEASE_TAG}_mono_export_templates.tpz" -o export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          unzip -q export_templates.tpz -d export_templates_temp
          cp -r export_templates_temp/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          cp -r export_templates_temp/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono/"

          rm -rf godot_mono.zip export_templates.tpz godot_mono export_templates_temp

      - name: Configure Keystore and Godot Editor Settings
        run: |
          KEYSTORE_PATH="$(pwd)/.keystore/permanent.keystore"
          if [ ! -f "$KEYSTORE_PATH" ]; then
            echo "Keystore not found at $KEYSTORE_PATH, creating deterministic fallback..."
            mkdir -p .keystore
            keytool -keyalg RSA -genkeypair -alias permanentkey -keypass permanentpass123 -keystore "$KEYSTORE_PATH" -storepass permanentpass123 -dname "CN=AnimeRunner,OU=Dev,O=KyokoApp,C=ID" -validity 20000 -deststoretype pkcs12
          fi

          EDITOR_SETTINGS_DIR="$HOME/.config/godot"
          mkdir -p "$EDITOR_SETTINGS_DIR"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\nexport/android/debug_keystore_user = "permanentkey"\nexport/android/debug_keystore_pass = "permanentpass123"\n' "$ANDROID_HOME" "$JAVA_HOME" "$KEYSTORE_PATH" > "$EDITOR_SETTINGS_DIR/editor_settings-4.tres"
          cp "$EDITOR_SETTINGS_DIR/editor_settings-4.tres" "$EDITOR_SETTINGS_DIR/editor_settings-4.5.tres"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEYSTORE_PATH" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=permanentkey" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=permanentpass123" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KEYSTORE_PATH" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=permanentkey" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=permanentpass123" >> $GITHUB_ENV

      - name: Generate Loading Video OGV (Mobile-Optimized)
        run: |
          # Sumber video ada di Amv/ (gdignore -> tidak ikut ter-export).
          # Hanya loading.ogv hasil konversi yang masuk ke APK (~4-6 MB,
          # menggantikan mp4 27 MB sebelumnya).
          mkdir -p videos
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

          SRC="Amv/Proyek Baru 28 [7EB4FCC].mp4"
          if [ -f "$SRC" ]; then
            echo "Converting to videos/loading.ogv (854px, q4, tanpa audio)..."
            ffmpeg -y -i "$SRC" -an -c:v libtheora -q:v 4 -vf "scale=854:-2" -r 24 videos/loading.ogv
          else
            echo "PERINGATAN: sumber video tidak ditemukan, layar loading tanpa video."
          fi
          ls -lh videos/ || true
          ls -lh icon*

      - name: Initialize Godot Project and Import Resources
        run: |
          timeout 180 godot --headless --editor --quit || true

      - name: Build C# Solution
        run: |
          dotnet build "Procedural Infinite Runner.csproj" -c ExportRelease || dotnet build "Procedural Infinite Runner.csproj" -c ExportDebug

      - name: Generate Incremental Patch Filter (git diff vs baseline)
        run: |
          python3 tools/update_pipeline/gen_patch_filter.py
          grep -A3 'name="PatchPack"' export_presets.cfg | head -5 || true
          # Daftar file berubah -> flag requires_restart / needs_new_apk di version.json.
          # baseline_commit.txt berisi baris komentar '#': lewati seperti di gen_patch_filter.py
          mkdir -p build/android
          BASELINE=$(grep -v '^\s*#' tools/update_pipeline/baseline_commit.txt | head -1 | tr -d '[:space:]')
          echo "Baseline diff: $BASELINE"
          git diff --name-only "$BASELINE" HEAD > build/android/changed_files.txt || true
          wc -l build/android/changed_files.txt && head -20 build/android/changed_files.txt

      - name: Export Base Data Pack and Patch-Only Pack
        run: |
          mkdir -p build/android

          # Ekor log dilempar sebagai anotasi supaya penyebab kegagalan terlihat
          # tanpa harus mengunduh arsip log run (kadang tidak bisa diakses).
          run_export() {
            local label="$1"; shift
            set +e
            timeout 300 "$@" > "build/android/${label}.log" 2>&1
            local ec=$?
            set -e
            if [ "$ec" -ne 0 ]; then
              MSG=$(tail -c 1200 "build/android/${label}.log" | tr '\n\r' '  ' | sed 's/%/%25/g; s/[[:space:]]\{2,\}/ /g')
              echo "::error::[${label}] exit=${ec} :: ${MSG}"
              return "$ec"
            fi
            tail -4 "build/android/${label}.log" || true
            return 0
          }

          echo "Exporting base data pack (assets_v1.pck)..."
          run_export base godot --headless --export-pack "AssetPack" build/android/assets_v1.pck

          echo "Exporting patch pack ($PATCH_NAME) - hanya file berubah sejak baseline..."
          # NOTE: export_filter="selected_resources" di Godot 4.5 tidak memangkas
          # isi pack sesuai ekspektasi pipeline ini (patch selalu seikut paket
          # penuh). Solusinya: stage proyek minimal lalu export all_resources.
          python3 tools/update_pipeline/stage_patch_project.py
          run_export patch godot --headless --path build/patch_project --export-pack "PatchPack" "$(pwd)/build/android/$PATCH_NAME"

          echo "Base PCK size: $(stat -c%s build/android/assets_v1.pck) bytes"
          echo "Patch PCK size: $(stat -c%s build/android/$PATCH_NAME) bytes"

          # Audit isi patch (dipublikasikan sebagai patch_report.txt di release).
          python3 tools/update_pipeline/list_pck.py "build/android/$PATCH_NAME" | tee build/android/patch_report.txt

          PATCH_BYTES=$(stat -c%s "build/android/$PATCH_NAME")
          if [ "$PATCH_BYTES" -gt 26214400 ]; then
            echo "::warning::Patch pack ${PATCH_BYTES} byte (>25MB). Pertimbangkan RE-BASE assets_v1.pck (lihat docs/SISTEM_UPDATE.md)."
          fi

      - name: Export Android APK Lite (InfiniteRunner-Lite.apk)
        run: |
          mkdir -p build/android
          # Bump versionCode/nama agar APK baru mulus menimpa instalasi lama
          sed -i "s/version\/code=.*/version\/code=${VERSION_CODE}/" export_presets.cfg
          sed -i "s/version\/name=.*/version\/name=\"${VERSION_NAME}\"/" export_presets.cfg
          echo "Set Android versionCode=${VERSION_CODE} versionName=${VERSION_NAME}"

          timeout 300 godot --headless --export-release "Android" build/android/InfiniteRunner-Lite.apk || \
          timeout 300 godot --headless --export-debug "Android" build/android/InfiniteRunner-Lite.apk

      - name: Trim APK (buang arsip statis .a sisa template) & Re-sign
        run: |
          # Template export Godot Mono ikut mem-paket lib/*/**.a (arsip statis
          # link-time, ~60MB!) yang tidak bisa dan tidak akan dimuat Android
          # runtime (loader hanya memuat .so). Membuangnya memangkas APK
          # secara signifikan. Setelah itu APK di-zipalign & di-sign ulang
          # dengan keystore release yang sama (edit zip membatalkan signature).
          APK="build/android/InfiniteRunner-Lite.apk"
          python3 - <<'EOF'
          import zipfile, shutil, os
          src = "build/android/InfiniteRunner-Lite.apk"
          dst = src + ".trimmed"
          removed, kept = [], 0
          with zipfile.ZipFile(src) as zin, zipfile.ZipFile(dst, "w") as zout:
              for info in zin.infolist():
                  if info.filename.startswith("lib/") and info.filename.endswith(".a"):
                      removed.append((info.filename, info.compress_size))
                      continue
                  data = zin.read(info.filename)
                  # Pertahankan STORE vs DEFLATE agar perilaku muat .so/dex tidak berubah
                  comp = zipfile.ZIP_DEFLATED if info.compress_type == zipfile.ZIP_DEFLATED else zipfile.ZIP_STORED
                  zi = zipfile.ZipInfo(info.filename, date_time=info.date_time)
                  zi.compress_type = comp
                  zi.external_attr = info.external_attr
                  zout.writestr(zi, data)
                  kept += 1
          saved = sum(s for _, s in removed)
          print(f"Membuang {len(removed)} arsip statis ({saved/1e6:.1f} MB):")
          for name, s in removed: print(f"  - {name} ({s/1e6:.2f} MB)")
          print(f"Entri dipertahankan: {kept}")
          os.replace(dst, src)
          print(f"APK setelah trim: {os.path.getsize(src)/1e6:.1f} MB")
          EOF

          ZIPALIGN=$(ls "$ANDROID_HOME"/build-tools/*/zipalign | head -1)
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | head -1)
          "$ZIPALIGN" -f -p 4 "$APK" "$APK.aligned" && mv "$APK.aligned" "$APK"
          "$APKSIGNER" sign \
            --ks "$GODOT_ANDROID_KEYSTORE_RELEASE_PATH" \
            --ks-key-alias "$GODOT_ANDROID_KEYSTORE_RELEASE_USER" \
            --ks-pass "pass:$GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD" \
            --key-pass "pass:$GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD" \
            --out "$APK.signed" "$APK"
          "$APKSIGNER" verify --verbose "$APK.signed"
          mv "$APK.signed" "$APK"
          echo "APK final setelah trim+sign: $(stat -c%s "$APK") bytes"

      - name: Verify Builds
        run: |
          for f in "build/android/InfiniteRunner-Lite.apk" "build/android/assets_v1.pck" "build/android/$PATCH_NAME"; do
            if [ ! -s "$f" ]; then
              echo "Error: $f tidak ada atau kosong!"; exit 1
            fi
            echo "$f OK - $(stat -c%s "$f") bytes"
          done

      - name: Diff sejak rilis sukses terakhir (untuk keputusan skip base pack)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keputusan "perlu upload base 50MB?" diambil dari diff sejak commit
          # rilis SUKSES sebelumnya (run terakhir = indeks 1, indeks 0 = run ini).
          PREV_SHA=$(gh run list --workflow android-build.yml --branch "${{ github.ref_name }}" \
              --status success --limit 2 --json headSha --jq '.[1].headSha' 2>/dev/null || true)
          if [ -z "$PREV_SHA" ]; then PREV_SHA=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD); fi
          echo "Diff skip-base terhadap rilis sukses: $PREV_SHA"
          git diff --name-only "$PREV_SHA" HEAD > build/android/changed_since_last_release.txt || true
          wc -l build/android/changed_since_last_release.txt && head -12 build/android/changed_since_last_release.txt
          # Referensi file base LAMA (agar manifest bisa menunjuknya saat skip-base):
          curl -sfL "https://github.com/KyokoApp/Unity/releases/download/android-apk/version.json" \
            -o build/android/prev_version.json || echo "{}" > build/android/prev_version.json
          gh api repos/KyokoApp/Unity/releases/tags/android-apk \
            --jq '.assets[] | select(.name=="assets_v1.pck") | {size: .size, digest: .digest}' \
            > build/android/base_asset_info.json || echo "{}" > build/android/base_asset_info.json
          cat build/android/base_asset_info.json

      - name: Generate version.json Manifest
        run: |
          python3 tools/update_pipeline/make_manifest.py \
            --build-dir build/android \
            --out build/android/version.json \
            --release-base-url "https://github.com/KyokoApp/Unity/releases/download/android-apk" \
            --version "$VERSION_NAME" \
            --version-code "$VERSION_CODE" \
            --base-name assets_v1.pck \
            --patch-name "$PATCH_NAME" \
            --apk-name InfiniteRunner-Lite.apk \
            --changed-files build/android/changed_files.txt \
            --changed-files-skip-base build/android/changed_since_last_release.txt \
            --prev-manifest build/android/prev_version.json \
            --base-asset-info build/android/base_asset_info.json

      - name: APK Size Report (apk_report.txt)
        run: |
          python3 - <<'EOF' | tee build/android/apk_report.txt
          import zipfile, collections
          p = "build/android/InfiniteRunner-Lite.apk"
          z = zipfile.ZipFile(p)
          infos = z.infolist()
          groups = collections.defaultdict(lambda: [0, 0])
          for i in infos:
              top = i.filename.split("/")[0] if "/" in i.filename else "(root)"
              groups[top][0] += i.compress_size
              groups[top][1] += i.file_size
          print(f"APK: {p}")
          import os
          print(f"Ukuran total: {os.path.getsize(p)/1e6:.1f} MB")
          print("\n== Ukuran per grup ==")
          for g, (c, u) in sorted(groups.items(), key=lambda kv: -kv[1][0]):
              print(f"{c/1e6:9.2f} MB  ({u/1e6:9.2f} MB tak-terkompresi)  {g}/")
          print("\n== 25 entri terbesar ==")
          for i in sorted(infos, key=lambda x: -x.compress_size)[:25]:
              print(f"{i.compress_size/1e6:9.2f} MB  ({i.file_size/1e6:9.2f} MB)  {i.filename}")
          if os.path.exists("videos/loading.ogv"):
              print(f"\nloading.ogv: {os.path.getsize('videos/loading.ogv')/1e6:.2f} MB")
          EOF
          APK_MB=$(python3 -c "import os; print(f\"{os.path.getsize('build/android/InfiniteRunner-Lite.apk')/1e6:.1f}\")")
          echo "Ukuran APK Lite: ${APK_MB} MB"
          if python3 -c "import os,sys; sys.exit(0 if os.path.getsize('build/android/InfiniteRunner-Lite.apk') > 100_000_000 else 1)"; then
            echo "::warning::APK ${APK_MB}MB melebihi target 100MB - lihat apk_report.txt untuk rincian."
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InfiniteRunner-Android-Release
          path: |
            build/android/InfiniteRunner-Lite.apk
            build/android/assets_v1.pck
            build/android/patch_*.pck
            build/android/version.json
            build/android/apk_report.txt

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Bersihkan aset usang di release: patch versi lama & APK fat legacy,
          # agar daftar unduhan tetap ramping (client lama tetap aman karena
          # hanya membaca version.json yang baru).
          if gh release view android-apk >/dev/null 2>&1; then
            gh release view android-apk --json assets --jq '.assets[].name' | while read -r asset; do
              case "$asset" in
                patch_*.pck)
                  if [ "$asset" != "$PATCH_NAME" ]; then
                    echo "Menghapus aset patch usang: $asset"
                    gh release delete-asset android-apk "$asset" --yes || true
                  fi
                  ;;
                InfiniteRunner.apk)
                  echo "Menghapus APK fat legacy (194MB): $asset"
                  gh release delete-asset android-apk "$asset" --yes || true
                  ;;
              esac
            done
          fi

          RELEASE_FILES="build/android/InfiniteRunner-Lite.apk build/android/$PATCH_NAME build/android/version.json build/android/apk_report.txt build/android/patch_report.txt"
          # Paket dasar 50MB hanya diunggah saat kontennya benar-benar berubah
          # (make_manifest.py menuliskan flag saat rilis hanya menyentuh kode).
          if [ ! -f build/android/skip_base_upload.flag ]; then
            RELEASE_FILES="build/android/assets_v1.pck $RELEASE_FILES"
          else
            echo "Melewati upload assets_v1.pck (konten dasar tak berubah)."
          fi
          if gh release view android-apk >/dev/null 2>&1; then
            echo "Release android-apk exists, uploading assets..."
            gh release upload android-apk $RELEASE_FILES --clobber
          else
            echo "Creating release android-apk..."
            gh release create android-apk $RELEASE_FILES \
              --title "Android APK" \
              --notes "Lite APK + unduhan aset in-game. Update hanya mengunduh paket yang berubah (lihat docs/SISTEM_UPDATE.md)."
          fi
