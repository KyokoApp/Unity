name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        run: |
          ANDROID_PATH="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_PATH" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_PATH" >> $GITHUB_ENV
          echo "$ANDROID_PATH/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_PATH/platform-tools" >> $GITHUB_PATH
          yes | "$ANDROID_PATH/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_PATH/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Setup Godot Engine Mono & Export Templates
        run: |
          GODOT_VERSION="4.5.1"
          RELEASE_TAG="4.5.1-stable"
          
          echo "Downloading Godot Mono..."
          curl -fL "https://github.com/godotengine/godot/releases/download/${RELEASE_TAG}/Godot_v${RELEASE_TAG}_mono_linux_x86_64.zip" -o godot_mono.zip
          unzip -q godot_mono.zip -d godot_mono
          sudo mv godot_mono/Godot_v${RELEASE_TAG}_mono_linux_x86_64/Godot_v${RELEASE_TAG}_mono_linux.x86_64 /usr/local/bin/godot
          sudo mv godot_mono/Godot_v${RELEASE_TAG}_mono_linux_x86_64/GodotSharp /usr/local/bin/
          sudo chmod +x /usr/local/bin/godot
          
          echo "Downloading Godot Export Templates..."
          curl -fL "https://github.com/godotengine/godot/releases/download/${RELEASE_TAG}/Godot_v${RELEASE_TAG}_mono_export_templates.tpz" -o export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          unzip -q export_templates.tpz -d export_templates_temp
          cp -r export_templates_temp/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          cp -r export_templates_temp/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono/"
          
          rm -rf godot_mono.zip export_templates.tpz godot_mono export_templates_temp

      - name: Create debug keystore and configure Godot editor settings
        run: |
          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"
          mkdir -p "$HOME/.android"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$DEBUG_KEYSTORE" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          
          EDITOR_SETTINGS_DIR="$HOME/.config/godot"
          mkdir -p "$EDITOR_SETTINGS_DIR"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' "$ANDROID_HOME" "$JAVA_HOME" "$DEBUG_KEYSTORE" > "$EDITOR_SETTINGS_DIR/editor_settings-4.tres"
          cp "$EDITOR_SETTINGS_DIR/editor_settings-4.tres" "$EDITOR_SETTINGS_DIR/editor_settings-4.5.tres"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$DEBUG_KEYSTORE" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> $GITHUB_ENV
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> $GITHUB_ENV

      - name: Initialize Godot Project and Import Resources
        run: |
          godot --headless --editor --quit || true

      - name: Build C# Solution
        run: |
          dotnet build "Procedural Infinite Runner.csproj" -c ExportDebug

      - name: Export Android APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" build/android/InfiniteRunner.apk

      - name: Verify APK
        run: |
          if [ ! -s build/android/InfiniteRunner.apk ]; then
            echo "Error: build/android/InfiniteRunner.apk was not generated or is empty!"
            exit 1
          fi
          echo "APK generated successfully. Size: $(stat -c%s build/android/InfiniteRunner.apk) bytes"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InfiniteRunner-APK
          path: build/android/InfiniteRunner.apk

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view android-apk >/dev/null 2>&1; then
            echo "Release android-apk exists, uploading APK asset..."
            gh release upload android-apk build/android/InfiniteRunner.apk --clobber
          else
            echo "Creating release android-apk..."
            gh release create android-apk build/android/InfiniteRunner.apk \
              --title "Android APK" \
              --notes "Latest Android build of Procedural Infinite Runner. Download and install InfiniteRunner.apk."
          fi
