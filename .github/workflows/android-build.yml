name: Build and Release Android APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        run: |
          ANDROID_PATH="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_PATH" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_PATH" >> $GITHUB_ENV
          echo "$ANDROID_PATH/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_PATH/platform-tools" >> $GITHUB_PATH
          yes | "$ANDROID_PATH/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_PATH/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Setup Godot Engine Mono & Export Templates
        run: |
          GODOT_VERSION="4.5.1"
          RELEASE_TAG="4.5.1-stable"
          
          echo "Downloading Godot Mono..."
          curl -fL "https://github.com/godotengine/godot/releases/download/${RELEASE_TAG}/Godot_v${RELEASE_TAG}_mono_linux_x86_64.zip" -o godot_mono.zip
          unzip -q godot_mono.zip -d godot_mono
          sudo mv godot_mono/Godot_v${RELEASE_TAG}_mono_linux_x86_64/Godot_v${RELEASE_TAG}_mono_linux.x86_64 /usr/local/bin/godot
          sudo mv godot_mono/Godot_v${RELEASE_TAG}_mono_linux_x86_64/GodotSharp /usr/local/bin/
          sudo chmod +x /usr/local/bin/godot
          
          echo "Downloading Godot Export Templates..."
          curl -fL "https://github.com/godotengine/godot/releases/download/${RELEASE_TAG}/Godot_v${RELEASE_TAG}_mono_export_templates.tpz" -o export_templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono"
          unzip -q export_templates.tpz -d export_templates_temp
          cp -r export_templates_temp/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          cp -r export_templates_temp/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono/"
          
          rm -rf godot_mono.zip export_templates.tpz godot_mono export_templates_temp

      - name: Verify App Icon and Convert Loading Video to OGV
        run: |
          mkdir -p videos
          if [ -f "Amv/Proyek Baru 28 [7EB4FCC].mp4" ]; then
            cp "Amv/Proyek Baru 28 [7EB4FCC].mp4" videos/loading.mp4
          fi

          echo "Installing ffmpeg to convert loading video to native Godot Theora OGV..."
          sudo apt-get update && sudo apt-get install -y ffmpeg

          if [ -f "videos/loading.mp4" ]; then
            echo "Converting videos/loading.mp4 to videos/loading.ogv (muted, optimized for mobile)..."
            ffmpeg -y -i videos/loading.mp4 -an -c:v libtheora -q:v 6 -vf "scale=1280:-2" videos/loading.ogv || true
          fi

          ls -lh icon*
          ls -lh videos/
      - name: Initialize Godot Project and Import Resources
        run: |
          timeout 120 godot --headless --editor --quit || true

      - name: Build C# Solution
        run: |
          dotnet build "Procedural Infinite Runner.csproj" -c ExportRelease || dotnet build "Procedural Infinite Runner.csproj" -c ExportDebug

      - name: Export Base Data Pack and Lightweight Patch Pack
        run: |
          mkdir -p build/android
          
          echo "Exporting base data pack (assets_v1.pck)..."
          timeout 300 godot --headless --export-pack "AssetPack" build/android/assets_v1.pck

          # Export lightweight update patch (only scripts, modified scenes, and configs, excluding heavy models & textures ~1-2 MB!)
          echo "Exporting lightweight patch pack (patch_v1.pck)..."
          timeout 180 godot --headless --export-pack "PatchPack" build/android/patch_v1.pck

          echo "Base PCK size: $(stat -c%s build/android/assets_v1.pck) bytes"
          echo "Patch PCK size: $(stat -c%s build/android/patch_v1.pck) bytes"

      - name: Configure Keystore and Godot Editor Settings
        env:
          # Stored as repository secrets, NOT in the tree. The keystore itself used to be
          # committed with its password in plaintext, which meant anyone with read access to
          # the repo could sign an APK that Android would happily install as an "update".
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets."
            echo "Add them under Settings > Secrets and variables > Actions, then re-run."
            echo "Generate the base64 blob with:  base64 -w0 permanent.keystore"
            exit 1
          fi

          KEY_ALIAS="${KEY_ALIAS:-permanentkey}"
          KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"

          mkdir -p .keystore
          KEYSTORE_PATH="$(pwd)/.keystore/release.keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "Keystore restored from secret ($(stat -c%s "$KEYSTORE_PATH") bytes)."

          EDITOR_SETTINGS_DIR="$HOME/.config/godot"
          mkdir -p "$EDITOR_SETTINGS_DIR"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\nexport/android/debug_keystore_user = "%s"\nexport/android/debug_keystore_pass = "%s"\n' \
            "$ANDROID_HOME" "$JAVA_HOME" "$KEYSTORE_PATH" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > "$EDITOR_SETTINGS_DIR/editor_settings-4.tres"
          cp "$EDITOR_SETTINGS_DIR/editor_settings-4.tres" "$EDITOR_SETTINGS_DIR/editor_settings-4.5.tres"

          # Hand the keystore to Godot for both debug and release exports.
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$KEYSTORE_PATH"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=$KEY_ALIAS"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=$KEY_PASSWORD"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$KEYSTORE_PATH"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEY_ALIAS"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEY_PASSWORD"
          } >> $GITHUB_ENV

      - name: Export Android APK Lite (InfiniteRunner-Lite.apk)
        run: |
          mkdir -p build/android
          # Automatically bump versionCode so new APK seamlessly installs over old APK without conflict
          VERSION_CODE=${{ github.run_number }}
          sed -i "s/version\/code=.*/version\/code=${VERSION_CODE}/" export_presets.cfg
          sed -i "s/version\/name=.*/version\/name=\"1.0.${VERSION_CODE}\"/" export_presets.cfg
          echo "Set Android versionCode=${VERSION_CODE}"

          # Attempt export release for stripped optimized binary, fallback to debug if needed
          timeout 300 godot --headless --export-release "Android" build/android/InfiniteRunner-Lite.apk || \
          timeout 300 godot --headless --export-debug "Android" build/android/InfiniteRunner-Lite.apk

      - name: Verify Builds
        run: |
          if [ ! -s build/android/InfiniteRunner-Lite.apk ]; then
            echo "Error: build/android/InfiniteRunner-Lite.apk was not generated or is empty!"
            exit 1
          fi
          echo "APK Lite generated successfully. Size: $(stat -c%s build/android/InfiniteRunner-Lite.apk) bytes"

          if [ ! -s build/android/assets_v1.pck ]; then
            echo "Error: build/android/assets_v1.pck was not generated or is empty!"
            exit 1
          fi
          echo "Assets PCK verified. Size: $(stat -c%s build/android/assets_v1.pck) bytes"

      - name: Generate version.json Manifest
        run: |
          BASE_SIZE=$(stat -c%s build/android/assets_v1.pck)
          BASE_SHA256=$(sha256sum build/android/assets_v1.pck | awk '{print $1}')
          
          PATCH_SIZE=$(stat -c%s build/android/patch_v1.pck)
          PATCH_SHA256=$(sha256sum build/android/patch_v1.pck | awk '{print $1}')

          python3 -c "
          import json
          
          manifest = {
              'version': '1.0.1',
              'apk_url': 'https://github.com/KyokoApp/Unity/releases/download/android-apk/InfiniteRunner-Lite.apk',
              'packs': [
                  {
                      'name': 'assets_v1.pck',
                      'url': 'https://github.com/KyokoApp/Unity/releases/download/android-apk/assets_v1.pck',
                      'size': int('$BASE_SIZE'),
                      'sha256': '$BASE_SHA256',
                      'is_patch': False,
                      'order': 1
                  },
                  {
                      'name': 'patch_v1.pck',
                      'url': 'https://github.com/KyokoApp/Unity/releases/download/android-apk/patch_v1.pck',
                      'size': int('$PATCH_SIZE'),
                      'sha256': '$PATCH_SHA256',
                      'is_patch': True,
                      'order': 2
                  }
              ]
          }
          with open('build/android/version.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          "
          echo "Generated version.json with delta patch support:"
          cat build/android/version.json

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: InfiniteRunner-Android-Release
          path: |
            build/android/InfiniteRunner-Lite.apk
            build/android/assets_v1.pck
            build/android/patch_v1.pck
            build/android/version.json

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_FILES="build/android/InfiniteRunner-Lite.apk build/android/assets_v1.pck build/android/patch_v1.pck build/android/version.json"
          if gh release view android-apk >/dev/null 2>&1; then
            echo "Release android-apk exists, uploading assets..."
            gh release upload android-apk $RELEASE_FILES --clobber
          else
            echo "Creating release android-apk..."
            gh release create android-apk $RELEASE_FILES \
              --title "Android APK" \
              --notes "Android build of Procedural Infinite Runner with In-Game Asset Downloader (Lite APK + assets_v1.pck)."
          fi
