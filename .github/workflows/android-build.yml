name: android-build

# Bangun APK debug lewat Godot 4.5.1 headless (pengganti android-release.yml
# era Unity). Push hanya ke branch kerja arena — merge ke main melewati PR.
on:
  push:
    branches: [main, arena/01a0ad77-unity]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      ## Aset pengguna (models/*.glb) TIDAK masuk git demi lisensi —
      ## ditanam oleh workflow fetch-assets ke cache aksi. Restore
      ## pakai restore-keys agar cache kedaluwarsa tetap tertarik.
      ## continue-on-error: build tanpa aset tetap jalan (fallback
      ## mannequin), sebagaimana hari-hari sebelumnya.
      - name: Pulihkan aset pengguna dari cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: models
          key: user-assets-v1
          restore-keys: |
            user-assets-

      - name: Unduh Godot 4.5.1 + export templates
        run: |
          GODOT_VER=4.5.1
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_VER}-stable/Godot_v${GODOT_VER}-stable_linux.x86_64.zip" \
               -o /tmp/godot.zip
          unzip -o /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v${GODOT_VER}-stable_linux.x86_64
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_VER}-stable/Godot_v${GODOT_VER}-stable_export_templates.tpz" \
               -o /tmp/tpl.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VER}.stable"
          unzip -o /tmp/tpl.tpz -d /tmp/tpl
          cp -r /tmp/tpl/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VER}.stable/"
          ls "$HOME/.local/share/godot/export_templates/${GODOT_VER}.stable/" | head

      - name: Siapkan debug keystore (APK pratinjau)
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 >/dev/null 2>&1 || true

      - name: Impor resource + editor settings Android
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          # tulis editor settings agar path SDK dibaca eksplisit
          mkdir -p "$HOME/.config/godot"
          cat >> "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cat "$HOME/.config/godot/editor_settings-4.5.tres"
          /tmp/godot-bin/Godot_v4.5.1-stable_linux.x86_64 \
            --headless --path . --import || true
          /tmp/godot-bin/Godot_v4.5.1-stable_linux.x86_64 \
            --headless --path . --editor --quit || true

      - name: Stempel build (identitas APK di layar)
        run: |
          STAMP="${GITHUB_SHA:0:7}-b$GITHUB_RUN_NUMBER"
          printf 'class_name BuildStamp\nextends RefCounted\nconst ID := "%s"\nstatic func id() -> String:\n\treturn ID\n' "$STAMP" > runtime/build_stamp.gd
          cat runtime/build_stamp.gd

      - name: Ekspor APK
        run: |
          mkdir -p build
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" 2>/dev/null | head
          /tmp/godot-bin/Godot_v4.5.1-stable_linux.x86_64 \
            --headless --verbose --path . --export-debug "Android" build/aurelia-debug.apk \
            2>&1 | tee /tmp/exportlog.txt
          test -s build/aurelia-debug.apk

      - name: Unggah artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-debug
          path: build/aurelia-debug.apk
          retention-days: 14

      - name: Catat jejak APK ke ci-logs (stempel + sha256)
        if: success()
        run: |
          # Sandbox tidak bisa mengunduh artefak/log Actions (blob Azure
          # di-block) — ringkasan kecil ini adalah bukti APK yang bisa dibaca
          # lewat github.com: git show origin/ci-logs:apk-log.txt
          SHA=$(sha256sum build/aurelia-debug.apk | cut -d' ' -f1)
          SIZE=$(stat -c%s build/aurelia-debug.apk)
          git config user.email "ci-debug@users.noreply.github.com"
          git config user.name "ci-debug"
          git fetch origin '+refs/heads/ci-logs:refs/remotes/origin/ci-logs' --force >/dev/null 2>&1 || true
          if git rev-parse --verify -q origin/ci-logs >/dev/null; then
            git checkout -f -B ci-logs origin/ci-logs
          else
            git checkout --orphan ci-logs
          fi
          rm -f apk-log.txt
          {
            echo "commit=$GITHUB_SHA run=$GITHUB_RUN_ID"
            echo "stempel=${GITHUB_SHA:0:7}-b$GITHUB_RUN_NUMBER"
            echo "sha256=$SHA"
            echo "size=$SIZE"
            echo "== ekor log export =="
            tail -40 /tmp/exportlog.txt 2>/dev/null || echo "(exportlog hilang)"
          } > apk-log.txt
          git add apk-log.txt
          git commit -m "apk jejak $(date -u '+%Y-%m-%d %H:%M UTC')" >/dev/null
          for i in 1 2 3; do
            git push origin ci-logs && exit 0
            sleep 3
            git fetch origin '+refs/heads/ci-logs:refs/remotes/origin/ci-logs' --force >/dev/null 2>&1
            git rebase origin/ci-logs >/dev/null 2>&1 || git rebase --abort
          done
          git push origin ci-logs || true
          exit 0

      - name: Simpan log export ke ci-logs saat gagal
        if: failure()
        run: |
          git config user.email "ci-debug@users.noreply.github.com"
          git config user.name "ci-debug"
          git fetch origin '+refs/heads/ci-logs:refs/remotes/origin/ci-logs' --force >/dev/null 2>&1 || true
          if git rev-parse --verify -q origin/ci-logs >/dev/null; then
            git checkout -f -B ci-logs origin/ci-logs
          else
            git checkout --orphan ci-logs
          fi
          rm -f export-log.txt
          echo "commit=$GITHUB_SHA run=$GITHUB_RUN_ID" > export-log.txt
          cat /tmp/exportlog.txt >> export-log.txt 2>/dev/null || true
          git add export-log.txt
          git commit -m "apk log $(date -u '+%Y-%m-%d %H:%M UTC')" >/dev/null
          for i in 1 2 3; do
            git push origin ci-logs && exit 0
            sleep 3
            git fetch origin '+refs/heads/ci-logs:refs/remotes/origin/ci-logs' --force >/dev/null 2>&1
            git rebase origin/ci-logs >/dev/null 2>&1 || git rebase --abort
          done
          git push origin ci-logs || true
          exit 0
