name: godot-tests

# Uji headless proyek Godot 4 (pengganti verify.yml era Unity).
on:
  push:
    branches: [arena/01a0ac44-unity]
  pull_request:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unduh Godot 4 headless (Linux)
        run: |
          GODOT_VER=4.5.1
          curl -fL "https://github.com/godotengine/godot/releases/download/${GODOT_VER}-stable/Godot_v${GODOT_VER}-stable_linux.x86_64.zip" \
               -o /tmp/godot.zip
          unzip -o /tmp/godot.zip -d /tmp/godot-bin
          chmod +x /tmp/godot-bin/Godot_v${GODOT_VER}-stable_linux.x86_64
          # impor resource sekali supaya cache siap
          /tmp/godot-bin/Godot_v${GODOT_VER}-stable_linux.x86_64 \
            --headless --path . --import || true

      - name: Jalankan runner uji
        run: |
          /tmp/godot-bin/Godot_v4.5.1-stable_linux.x86_64 \
            --headless --path . --script tests/run_tests.gd 2>&1 | tee /tmp/testlog.txt
          exit ${PIPESTATUS[0]}

      - name: Smoke-run game asli (600 frame, tangkap SCRIPT ERROR)
        run: |
          set +e
          timeout 120 /tmp/godot-bin/Godot_v4.5.1-stable_linux.x86_64 \
            --headless --path . --quit-after 600 2>&1 | tee /tmp/bootlog.txt
          EC=$?
          echo "exit=$EC" >> /tmp/bootlog.txt
          # crash/timeout (124) atau ada SCRIPT ERROR di log -> gagal
          if [ "$EC" -ne 0 ] || ! grep -q "boot selesai" /tmp/bootlog.txt \
             || grep -qE "SCRIPT ERROR|SHADER ERROR" /tmp/bootlog.txt; then
            exit 1
          fi

      - name: Unggah log uji ke branch ci-logs
        if: always()
        run: |
          git config user.email "ci-debug@users.noreply.github.com"
          git config user.name "ci-debug"
          git fetch origin arena/01a0ac44-unity --depth=1 2>/dev/null || true
          git checkout --orphan ci-logs 2>/dev/null || git checkout ci-logs
          git rm -rf . >/dev/null 2>&1 || true
          echo "commit=$GITHUB_SHA run=$GITHUB_RUN_ID" > run-log.txt
          cat /tmp/testlog.txt >> run-log.txt
          cp /tmp/bootlog.txt boot-log.txt 2>/dev/null || echo "bootlog tidak ada" > boot-log.txt
          git add run-log.txt boot-log.txt
          git commit -m "ci log $(date -u '+%Y-%m-%d %H:%M UTC')" >/dev/null
          git push --force origin ci-logs
