name: apk-release
## Auto-build APK Unity + paket konten di GitHub Actions (pola sama seperti
## repo Godot lama): push konten game -> langsung build -> terbit ke Release.
##  - APK            -> release `apk-latest`   (instal sekali)
##  - manifest+konten -> release `content-latest` (diunduh in-game, tanpa instal ulang)
##
## Lisensi: cukup secrets UNITY_EMAIL + UNITY_PASSWORD (akun Unity biasa, 2FA
## nonaktif) — step "Siapkan lisensi Unity" mengaktivasi Personal otomatis lewat
## container unityci/editor. Fallback opsional: secret UNITY_LICENSE berisi .ulf
## (mis. dari Unity Hub di PC) — kalau terisi, dipakai langsung tanpa aktivasi.
## Lihat docs/CARA_SETUP_CI.md.

on:
  push:
    branches:
      - main
      - arena/01a0f5f2-unity
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/apk_release.yml"
  workflow_dispatch:

concurrency: apk-release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Siapkan lisensi Unity
        env:
          UNITY_LICENSE_SECRET: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -uo pipefail
          IMAGE="unityci/editor:ubuntu-2022.3.45f1-base-3"
          ULF_IN_CONTAINER="/root/.local/share/unity3d/Unity/Unity_lic.ulf"

          tulis_lisensi_ke_env() {
            # $1 = file .ulf ; tulis ke $GITHUB_ENV sebagai UNITY_LICENSE (heredoc)
            {
              echo "UNITY_LICENSE<<__ULF__"
              cat "$1"
              echo "__ULF__"
            } >> "$GITHUB_ENV"
          }

          # ---- 1) Secret UNITY_LICENSE terisi? pakai langsung ----
          if [ -n "${UNITY_LICENSE_SECRET:-}" ]; then
            echo "Secret UNITY_LICENSE terisi — pakai lisensi dari secrets (tanpa aktivasi)."
            TMP_ULF="$(mktemp)"
            printf '%s\n' "$UNITY_LICENSE_SECRET" > "$TMP_ULF"
            tulis_lisensi_ke_env "$TMP_ULF"
            rm -f "$TMP_ULF"
            echo "UNITY_LICENSE siap di \$GITHUB_ENV."
            exit 0
          fi

          # ---- 2) Kosong? aktivasi Personal otomatis lewat container ----
          echo "Secret UNITY_LICENSE kosong — coba aktivasi Personal otomatis dengan $IMAGE."
          if [ -z "${UNITY_EMAIL:-}" ] || [ -z "${UNITY_PASSWORD:-}" ]; then
            echo "::error::UNITY_LICENSE kosong DAN UNITY_EMAIL/UNITY_PASSWORD belum lengkap. Isi secrets UNITY_EMAIL + UNITY_PASSWORD (akun Unity biasa, 2FA nonaktif) — lihat docs/CARA_SETUP_CI.md. Fallback: isi UNITY_LICENSE dengan seluruh isi file .ulf dari Unity Hub di PC."
            exit 1
          fi

          # Saring log Unity: email/password tidak boleh bocor ke log run.
          saring_log() {
            while IFS= read -r line; do
              if [ -n "${UNITY_EMAIL:-}" ]; then line="${line//"$UNITY_EMAIL"/[email-disaring]}"; fi
              if [ -n "${UNITY_PASSWORD:-}" ]; then line="${line//"$UNITY_PASSWORD"/[password-disaring]}"; fi
              printf '%s\n' "$line"
            done
          }

          docker rm -f unity-activate >/dev/null 2>&1 || true
          echo "Pull image $IMAGE (bisa beberapa menit, image besar)…"
          if ! docker pull "$IMAGE"; then
            echo "::error::Gagal pull image $IMAGE — periksa nama tag/koneksi runner."
            exit 1
          fi

          echo "Jalankan aktivasi Personal (kredensial lewat env container, log disaring)…"
          # Runner memakai `bash -e`; errexit dimatikan sementara — patokan sukses
          # aktivasi adalah file .ulf, bukan exit code unity-editor.
          # -createProject /tmp/actproj: tanpa project valid, editor crash
          # ("Failed to update project manifest") dan .ulf tidak sempat ditulis.
          set +e
          docker run --name unity-activate \
            -e UNITY_EMAIL -e UNITY_PASSWORD \
            "$IMAGE" \
            bash -c 'unity-editor -batchmode -nographics -quit -createProject /tmp/actproj -logFile /dev/stdout -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD"
              st=$?
              echo "[activation] unity-editor exit=$st"
              # Editor bisa exit sebelum daemon lisensi selesai menulis .ulf — tunggu.
              for i in $(seq 1 20); do
                [ -s /root/.local/share/unity3d/Unity/Unity_lic.ulf ] && { echo "[activation] Unity_lic.ulf tertulis setelah ${i}s"; break; }
                sleep 1
              done
              echo "[activation] diagnostik (hanya path, tanpa kredensial):"
              find /root -name "*.ulf" 2>/dev/null | head -5
              ls -la /root/.local/share/unity3d/Unity/ 2>/dev/null || echo "[activation] direktori /root/.local/share/unity3d/Unity tidak ada"' \
            2>&1 | saring_log
          EDITOR_STATUS=${PIPESTATUS[0]}
          set -e

          echo "unity-editor selesai (exit code $EDITOR_STATUS) — ambil isi direktori lisensi dari container."
          TMP_DIR="$(mktemp -d)"
          if docker cp "unity-activate:/root/.local/share/unity3d/Unity" "$TMP_DIR/UnityLicDir" 2>/dev/null; then
            ls -la "$TMP_DIR/UnityLicDir" | sed 's/^/[license-dir] /' || true
          else
            echo "[license-dir] direktori /root/.local/share/unity3d/Unity tidak ada di container"
          fi
          if [ ! -s "$TMP_DIR/UnityLicDir/Unity_lic.ulf" ]; then
            echo "::error::Aktivasi Personal otomatis GAGAL: $ULF_IN_CONTAINER tidak ada/kosong di container (exit code editor: $EDITOR_STATUS). Penyebab umum: UNITY_EMAIL/UNITY_PASSWORD salah, 2FA masih aktif di akun Unity, atau gangguan server Unity. Coba lagi nanti, atau pakai fallback UNITY_LICENSE (.ulf dari Unity Hub) — lihat docs/CARA_SETUP_CI.md."
            docker rm -f unity-activate >/dev/null 2>&1 || true
            rm -rf "$TMP_DIR"
            exit 1
          fi

          tulis_lisensi_ke_env "$TMP_DIR/UnityLicDir/Unity_lic.ulf"
          rm -rf "$TMP_DIR"
          docker rm -f unity-activate >/dev/null 2>&1 || true
          echo "Aktivasi Personal berhasil — UNITY_LICENSE siap di \$GITHUB_ENV."

      - uses: actions/checkout@v4

      - name: Cache Library (percepat build berikutnya)
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Build APK + paket konten (Unity 2022.3, Android, IL2CPP)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildMethod: CiBuild.BuildAll
          versioning: None
          allowDirtyBuild: true

      - name: Pastikan hasil build ada
        run: |
          ls -laR build || true
          test -f build/Android/UAL2Playground.apk
          test -f build/content/manifest.json

      - name: Terbitkan APK -> release apk-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Build otomatis #${{ github.run_number }} dari commit ${{ github.sha }}.
          Instal APK ini SEKALI saja — update konten berikutnya diunduh otomatis dari dalam game (release content-latest)."
          gh release view apk-latest >/dev/null 2>&1 || \
            gh release create apk-latest --title "APK Terbaru (auto-build)" --notes "$NOTES"
          gh release edit apk-latest --notes "$NOTES"
          gh release upload apk-latest build/Android/UAL2Playground.apk --clobber

      - name: Terbitkan konten -> release content-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Konten in-game v${{ github.run_number }} (diunduh otomatis oleh aplikasi saat start — tidak perlu instal ulang APK)."
          gh release view content-latest >/dev/null 2>&1 || \
            gh release create content-latest --title "Konten In-Game (auto-update)" --notes "$NOTES"
          gh release edit content-latest --notes "$NOTES"
          gh release upload content-latest build/content/* --clobber
