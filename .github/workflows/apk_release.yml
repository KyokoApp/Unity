name: apk-release
## Auto-build APK Unity + paket konten di GitHub Actions (pola sama seperti
## repo Godot lama): push konten game -> langsung build -> terbit ke Release.
##  - APK            -> release `apk-latest`   (instal sekali)
##  - manifest+konten -> release `content-latest` (diunduh in-game, tanpa instal ulang)
##
## Lisensi: cukup secrets UNITY_EMAIL + UNITY_PASSWORD (akun Unity biasa, 2FA
## nonaktif) — step "Siapkan lisensi Unity" mengaktivasi Personal otomatis lewat
## container unityci/editor (Unity.Licensing.Client, fallback unity-editor login),
## lalu memasukkan Unity_lic.ulf ATAU serial Personal ke $GITHUB_ENV (dibutuhkan
## unity-builder@v4 di sisi host). Karena aktivasi serial ala v4 sudah tidak
## berlaku untuk Personal, step "Patch unity-builder v4" menimpa activate.sh &
## return_license.sh di cache action runner dengan strategi seat Personal
## (Unity.Licensing.Client --activate-all --include-personal; game-ci/cli#246).
## Fallback opsional: secret UNITY_LICENSE berisi .ulf (mis. dari Unity Hub di
## PC) — kalau terisi, dipakai langsung tanpa aktivasi di step lisensi.
## Lihat docs/CARA_SETUP_CI.md.

on:
  push:
    branches:
      - main
      - arena/01a0f5f2-unity
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/apk_release.yml"
  workflow_dispatch:

concurrency: apk-release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Siapkan lisensi Unity
        env:
          UNITY_LICENSE_SECRET: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: bash .github/unity-builder-steps/prepare_license.sh
      - uses: actions/checkout@v4

      - name: Cache Library (percepat build berikutnya)
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Patch unity-builder v4 → aktivasi Personal via Licensing.Client
        run: |
          set -euo pipefail
          # unity-builder@v4 (cache _actions runner, di-mount ke /steps container
          # build) hanya mendukung aktivasi serial/license-server — keduanya
          # sudah tidak berlaku untuk Unity Personal. Timpa activate.sh &
          # return_license.sh dengan strategi seat Personal (game-ci/cli#246):
          # Unity.Licensing.Client --activate-all --include-personal.
          shopt -s nullglob
          CANDIDATES=( "$GITHUB_WORKSPACE"/../../_actions/game-ci/unity-builder/*/dist/platforms/ubuntu/steps )
          STEPS_DIR="${CANDIDATES[0]:-}"
          if [ -z "$STEPS_DIR" ] || [ ! -f "$STEPS_DIR/activate.sh" ]; then
            echo "::error::Folder steps game-ci/unity-builder tidak ditemukan di runner (_actions/game-ci/unity-builder/*/dist/platforms/ubuntu/steps). Layout runner/action berubah — perbarui step patch ini."
            ls -la "$GITHUB_WORKSPACE/../.." 2>/dev/null || true
            exit 1
          fi
          echo "Patch: $STEPS_DIR"
          cp -v "$GITHUB_WORKSPACE/.github/unity-builder-steps/activate.sh"       "$STEPS_DIR/activate.sh"
          cp -v "$GITHUB_WORKSPACE/.github/unity-builder-steps/return_license.sh" "$STEPS_DIR/return_license.sh"
          chmod +x "$STEPS_DIR/activate.sh" "$STEPS_DIR/return_license.sh"
          echo "Patch selesai — container build akan aktivasi seat Personal lewat Unity.Licensing.Client."

      - name: Build APK + paket konten (Unity 2022.3, Android, IL2CPP)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildMethod: CiBuild.BuildAll
          versioning: None
          allowDirtyBuild: true
          # unity-builder tidak meneruskan GITHUB_RUN_NUMBER ke dalam container;
          # CiBuild.BuildAll membaca "-runNumber <n>" dari argumen CLI editor
          # (build.sh meneruskan $CUSTOM_PARAMETERS ke unity-editor) supaya
          # contentVersion/appVersion/versionCode naik tiap build.
          customParameters: '-runNumber ${{ github.run_number }}'

      - name: Pastikan hasil build ada
        run: |
          ls -laR build || true
          test -f build/Android/UAL2Playground.apk
          test -f build/content/manifest.json

      - name: Terbitkan konten -> release content-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Konten in-game v${{ github.run_number }} (diunduh otomatis oleh aplikasi saat start — tidak perlu instal ulang APK).
          Release ini sengaja ditandai Pre-release: badge Latest di halaman Releases harus jatuh ke release APK."
          gh release view content-latest >/dev/null 2>&1 || \
            gh release create content-latest --title "Konten In-Game (auto-update)" --notes "$NOTES"
          gh release edit content-latest --prerelease --notes "$NOTES"
          gh release upload content-latest build/content/* --clobber

      - name: Terbitkan APK -> release apk-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Build otomatis #${{ github.run_number }} dari commit ${{ github.sha }}.
          Instal APK ini SEKALI saja — update konten berikutnya diunduh otomatis dari dalam game (release content-latest).
          Di halaman Releases, release INI yang paling atas (Latest); file APK: UAL2Playground.apk di bawah Assets."
          gh release view apk-latest >/dev/null 2>&1 || \
            gh release create apk-latest --title "APK Terbaru (auto-build)" --notes "$NOTES"
          gh release edit apk-latest --notes "$NOTES"
          gh release upload apk-latest build/Android/UAL2Playground.apk --clobber

  sim-test:
    ## Tes headless PlayMode (audit fisika+animasi): game dijalankan sungguhan
    ## di editor (xvfb), karakter jalan/lompat/slide/serang lewat API yang sama
    ## dengan tombol UI; angka fisika + clip animasi dicatat ke log, screenshot
    ## diunggah sebagai artefak run (lihat tanpa instal APK). Job ini jalan
    ## SETELAH APK terbit; kalau gagal = regresi terbaca, perbaiki commit berikutnya.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan lisensi Unity
        env:
          UNITY_LICENSE_SECRET: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: bash .github/unity-builder-steps/prepare_license.sh

      - name: Tulis .ulf untuk mount ke container
        run: |
          set -euo pipefail
          mkdir -p /tmp/ulf
          printf '%s\n' "$UNITY_LICENSE" > /tmp/ulf/Unity_lic.ulf
          ls -la /tmp/ulf

      - name: Cache Library (sim)
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Sim-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Sim-
            Library-Android-

      - name: Prep aset generated (ExtractLocomotion + ImportWorld)
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD":/project \
            -v /tmp/ulf/Unity_lic.ulf:/root/.local/share/unity3d/Unity/Unity_lic.ulf:ro \
            unityci/editor:ubuntu-2022.3.45f1-base-3 \
            unity-editor -batchmode -nographics -buildTarget StandaloneLinux64 \
              -projectPath /project -executeMethod CiBuild.PrepSim -logFile -

      - name: Jalankan tes PlayMode headless (xvfb) + screenshot
        run: |
          set -uo pipefail
          mkdir -p build/simshots
          Xvfb :99 -screen 0 1280x720x24 >/tmp/xvfb.log 2>&1 &
          sleep 3
          docker run --rm \
            -e DISPLAY=:99 \
            -v /tmp/.X11-unix:/tmp/.X11-unix \
            -v "$PWD":/project \
            -v /tmp/ulf/Unity_lic.ulf:/root/.local/share/unity3d/Unity/Unity_lic.ulf:ro \
            unityci/editor:ubuntu-2022.3.45f1-base-3 \
            unity-editor -batchmode -buildTarget StandaloneLinux64 -projectPath /project \
              -testPlatform PlayMode -runTests -testResults /project/build/sim-results.xml \
              -logFile - | tail -40
          true

      - name: Evaluasi hasil tes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, sys, os, glob
          x = 'build/sim-results.xml'
          if not os.path.exists(x):
              print('::error::sim-results.xml tidak ada - tes tidak jalan'); sys.exit(1)
          r = ET.parse(x).getroot()
          failed = int(r.get('failed', '0')) + int(r.get('errors', '0') or 0)
          print(f"[SIM] total={r.get('total','?')} passed={r.get('passed','?')} failed={failed}")
          for tc in r.iter('test-case'):
              print('  -', tc.get('result'), tc.get('name'))
          for f in sorted(glob.glob('build/simshots/*.png')):
              print('  shot:', f)
          sys.exit(1 if failed else 0)
          PY

      - name: Unggah screenshot & hasil tes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-screenshots-v${{ github.run_number }}
          path: |
            build/simshots
            build/sim-results.xml
          if-no-files-found: warn
