name: apk-release
## Auto-build APK Unity + paket konten di GitHub Actions (pola sama seperti
## repo Godot lama): push konten game -> langsung build -> terbit ke Release.
##  - APK            -> release `apk-latest`   (instal sekali)
##  - manifest+konten -> release `content-latest` (diunduh in-game, tanpa instal ulang)
##
## Lisensi: cukup secrets UNITY_EMAIL + UNITY_PASSWORD (akun Unity biasa, 2FA
## nonaktif) — step "Siapkan lisensi Unity" mengaktivasi Personal otomatis lewat
## container unityci/editor (Unity.Licensing.Client, fallback unity-editor login),
## lalu memasukkan Unity_lic.ulf ATAU serial Personal ke $GITHUB_ENV (dibutuhkan
## unity-builder@v4 di sisi host). Karena aktivasi serial ala v4 sudah tidak
## berlaku untuk Personal, step "Patch unity-builder v4" menimpa activate.sh &
## return_license.sh di cache action runner dengan strategi seat Personal
## (Unity.Licensing.Client --activate-all --include-personal; game-ci/cli#246).
## Fallback opsional: secret UNITY_LICENSE berisi .ulf (mis. dari Unity Hub di
## PC) — kalau terisi, dipakai langsung tanpa aktivasi di step lisensi.
## Signing Android selalu memakai satu keystore release dari empat repository
## secrets ANDROID_KEYSTORE_*; workflow berhenti bila belum dikonfigurasi.
## Lihat docs/CARA_SETUP_CI.md.

on:
  push:
    branches:
      - main
      - arena/01a0f7e5-unity
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/apk_release.yml"
  workflow_dispatch:

concurrency: apk-release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Validasi secrets signing Android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_NAME: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASS ANDROID_KEYALIAS_NAME ANDROID_KEYALIAS_PASS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Repository secret $name belum diatur. Lihat docs/CARA_SETUP_CI.md; jangan menerbitkan APK debug-signed."
              exit 1
            fi
          done

      - name: Siapkan lisensi Unity
        env:
          UNITY_LICENSE_SECRET: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: bash .github/unity-builder-steps/prepare_license.sh

      - name: Cache Library (percepat build berikutnya)
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Patch unity-builder v4 → aktivasi Personal via Licensing.Client
        run: |
          set -euo pipefail
          # unity-builder@v4 (cache _actions runner, di-mount ke /steps container
          # build) hanya mendukung aktivasi serial/license-server — keduanya
          # sudah tidak berlaku untuk Unity Personal. Timpa activate.sh &
          # return_license.sh dengan strategi seat Personal (game-ci/cli#246):
          # Unity.Licensing.Client --activate-all --include-personal.
          shopt -s nullglob
          CANDIDATES=( "$GITHUB_WORKSPACE"/../../_actions/game-ci/unity-builder/*/dist/platforms/ubuntu/steps )
          STEPS_DIR="${CANDIDATES[0]:-}"
          if [ -z "$STEPS_DIR" ] || [ ! -f "$STEPS_DIR/activate.sh" ]; then
            echo "::error::Folder steps game-ci/unity-builder tidak ditemukan di runner (_actions/game-ci/unity-builder/*/dist/platforms/ubuntu/steps). Layout runner/action berubah — perbarui step patch ini."
            ls -la "$GITHUB_WORKSPACE/../.." 2>/dev/null || true
            exit 1
          fi
          echo "Patch: $STEPS_DIR"
          cp -v "$GITHUB_WORKSPACE/.github/unity-builder-steps/activate.sh"       "$STEPS_DIR/activate.sh"
          cp -v "$GITHUB_WORKSPACE/.github/unity-builder-steps/return_license.sh" "$STEPS_DIR/return_license.sh"
          chmod +x "$STEPS_DIR/activate.sh" "$STEPS_DIR/return_license.sh"
          echo "Patch selesai — container build akan aktivasi seat Personal lewat Unity.Licensing.Client."

      - name: Build APK + paket konten (Unity 2022.3, Android, IL2CPP)
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildMethod: CiBuild.BuildAll
          versioning: None
          allowDirtyBuild: true
          androidKeystoreName: arpg-release.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          # unity-builder tidak meneruskan GITHUB_RUN_NUMBER ke dalam container;
          # CiBuild.BuildAll membaca "-runNumber <n>" dari argumen CLI editor
          # (build.sh meneruskan $CUSTOM_PARAMETERS ke unity-editor) supaya
          # contentVersion/appVersion/versionCode naik tiap build.
          customParameters: '-runNumber ${{ github.run_number }}'

      - name: Pastikan hasil build ada dan hash manifest valid
        run: |
          ls -laR build || true
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          apk = Path('build/Android/Arpg.apk')
          root = Path('build/content')
          manifest_path = root / 'manifest.json'
          assert apk.is_file() and manifest_path.is_file(), 'APK/manifest build tidak ditemukan'
          manifest = json.loads(manifest_path.read_text())
          assert manifest['apkSize'] == apk.stat().st_size, 'apkSize manifest tidak cocok'
          assert manifest['apkSha256'] == hashlib.sha256(apk.read_bytes()).hexdigest(), 'apkSha256 manifest tidak cocok'
          assert manifest['apkUrl'].endswith('/Arpg-' + manifest['appVersion'] + '.apk'), 'URL APK versi tidak cocok'
          tuning = root / manifest['tuningFile']
          assert tuning.is_file(), 'File tuning versi-hash tidak ditemukan: ' + str(tuning)
          assert tuning.stat().st_size == manifest['tuningSize'], 'Ukuran tuning manifest tidak cocok'
          assert hashlib.sha256(tuning.read_bytes()).hexdigest() == manifest['tuningSha256'], 'SHA tuning manifest tidak cocok'
          packs = {pack['id']: pack for pack in manifest['packs']}
          for required in ('arpg-character', 'arpg-world'):
              assert required in packs, 'AssetBundle wajib hilang: ' + required
          for pack in packs.values():
              asset = root / pack['file']
              assert asset.is_file(), 'AssetBundle tidak ditemukan: ' + str(asset)
              assert asset.stat().st_size == pack['size'], 'Ukuran bundle tidak cocok: ' + pack['id']
              assert hashlib.sha256(asset.read_bytes()).hexdigest() == pack['sha256'], 'SHA bundle tidak cocok: ' + pack['id']
          print('APK, dua AssetBundle, dan SHA-256 manifest valid.')
          PY
          # Unity Builder writes build/Android as root inside its container; keep
          # the versioned copy in runner-owned build/ so GitHub Actions can create it.
          cp build/Android/Arpg.apk "build/Arpg-1.0.${{ github.run_number }}.apk"

      - name: Terbitkan APK -> release apk-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Build otomatis #${{ github.run_number }} dari commit ${{ github.sha }}.
          Instal APK ini SEKALI saja — animasi dan visual akan diperbarui dari dalam game.
          Release APK tetap menjadi Latest; file pemasang: Arpg.apk."
          gh release view apk-latest >/dev/null 2>&1 || \
            gh release create apk-latest --title "APK Arpg Terbaru" --notes "$NOTES"
          gh release edit apk-latest --notes "$NOTES"
          gh release upload apk-latest build/Android/Arpg.apk "build/Arpg-1.0.${{ github.run_number }}.apk" --clobber

      - name: Terbitkan konten -> release content-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Konten in-game v${{ github.run_number }} — aset visual/animasi diunduh oleh Arpg.
          Manifest memuat hash dan URL APK resmi; unggahan APK selalu selesai lebih dahulu.
          Release ini sengaja ditandai Pre-release agar badge Latest tetap jatuh ke APK."
          gh release view content-latest >/dev/null 2>&1 || \
            gh release create content-latest --title "Konten Arpg (auto-update)" --notes "$NOTES"
          gh release edit content-latest --prerelease --notes "$NOTES"
          # Unggah aset ber-hash yang immutable lebih dulu; manifest baru terakhir,
          # agar klien lama tidak melihat kombinasi manifest/bundle yang setengah terbit.
          gh release upload content-latest build/content/*.bundle build/content/tuning-*.json --clobber
          gh release upload content-latest build/content/manifest.json --clobber

