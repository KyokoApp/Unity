name: apk-release
## Bangun APK launcher + AIO di runner GitHub (akses internet penuh):
## unduh Godot 4.5.2 editor + export templates resmi, siapkan SDK/JDK/keystore,
## export kedua preset, lalu terbitkan aset ke GitHub Release $TAG.
## Diagnostik build ditulis ke release notes agar terbaca via API.
on:
  push:
    paths:
      - ".github/workflows/apk_release.yml"
  workflow_dispatch:

concurrency: apk-release

permissions:
  contents: write

env:
  GVER: 4.5.2
  GDIR: export_templates/4.5.2.stable
  TAG: apk-20260920-2302

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Jaga-jaga — tolak marker konflik git di source
        run: |
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>) ' project/ tools/ 2>/dev/null; then
            echo "::error::ada marker konflik tersisa — merge/rebase belum bersih; build dibatalkan"
            exit 1
          fi
          echo "bersih dari marker konflik"

      - name: Lint GDScript (gdparse) — tolak parse error sebelum export
        run: |
          pip install -q gdtoolkit
          FAIL=0
          for f in $(find project -name "*.gd"); do
            if ! out=$(gdparse "$f" 2>&1); then
              echo "::error::GDScript parse error di $f :: $(echo "$out" | head -5 | tr '\n' ' ')"
              FAIL=1
            fi
          done
          [ "$FAIL" = 0 ] && echo "semua gd lolos parse" || exit 1

      - name: Dependensi sistem untuk editor Godot
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq --no-install-recommends \
            libx11-6 libxkbcommon0 libxinerama1 libxcursor1 libxi6 \
            libxrandr2 libxext6 libxrender1 libgl1 libegl1 libasound2 \
            fontconfig libfontconfig1 unzip zip

      - name: Unduh Godot editor + export templates resmi
        run: |
          set -e
          curl -sL --fail -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GVER}-stable/Godot_v${GVER}-stable_linux.x86_64.zip"
          curl -sL --fail -o templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GVER}-stable/Godot_v${GVER}-stable_export_templates.tpz"
          unzip -qo godot.zip
          mv Godot_v${GVER}-stable_linux.x86_64 godot && chmod +x godot
          mkdir -p "$HOME/.local/share/godot/${GDIR}"
          mkdir -p tpz
          (cd tpz && unzip -q ../templates.tpz "templates/android_debug.apk" "templates/android_release.apk" "templates/version.txt")
          cp tpz/templates/* "$HOME/.local/share/godot/${GDIR}/"
          ls -la "$HOME/.local/share/godot/${GDIR}/"

      - name: Keystore debug + editor settings (SDK/JDK runner)
        run: |
          mkdir -p "$HOME/.config/godot" exports/android
          keytool -genkey -v -keystore "$GITHUB_WORKSPACE/exports/android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" | tail -2
          JAVA_DIR="$(dirname "$(dirname "$(readlink -f "$(which java)")")")"
          echo "android-sdk = $ANDROID_SDK_ROOT"
          echo "java = $JAVA_DIR"
          ls "$ANDROID_SDK_ROOT/build-tools" | tail -3
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<SEOF
          [gd_resource type="EditorSettings" format=1]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_DIR"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/exports/android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SEOF

      - name: Import proyek (sekali)
        run: |
          RC=0; timeout 900 ./godot --headless --path project --import > "$GITHUB_WORKSPACE/import.log" 2>&1 || RC=$?
          echo "import.rc=$RC"; tail -8 "$GITHUB_WORKSPACE/import.log"

      - name: Bangun pack + manifest (delta sanity)
        run: |
          echo "::notice::checkout versions.json: $(head -c 90 server/versions.json | tr '\n' ' ')"
          python3 tools/build_packs.py --godot ./godot | tail -8
          echo "::notice::manifest hasil: $(python3 -c 'import json; m=json.load(open("server/manifest.json")); print(m["game_version"]); print({k: v["version"] for k, v in list(m["packs"].items())[:3]})')"

      - name: Publikasikan server konten -> branch "content" (raw)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          DEST=/tmp/ct
          if ! git clone --depth 1 --branch content               https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git $DEST 2>/dev/null; then
            git clone --depth 1 https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/$GITHUB_REPOSITORY.git $DEST
            (cd $DEST && git checkout --orphan content && rm -rf ./*)
          fi
          echo "::notice::ws manifest: $(grep -o '"game_version": *"[^"]*"' "$GITHUB_WORKSPACE/server/manifest.json" | head -1)"
          rsync -a --delete --exclude=.git "$GITHUB_WORKSPACE/server/" "$DEST/"; echo "::notice::rsync rc=$?"
          echo "::notice::dest manifest sesudah rsync: $(grep -o '"game_version": *"[^"]*"' "$DEST/manifest.json" | head -1)"
          # Perbaikan deterministik: manifest+versions WAJIB identik dengan workspace
          # (pernah 2x manifest di dest ketinggalan walau rsync rc=0 — race aneh runner).
          for FN in manifest.json versions.json; do
            if ! cmp -s "$GITHUB_WORKSPACE/server/$FN" "$DEST/$FN"; then
              cp -f "$GITHUB_WORKSPACE/server/$FN" "$DEST/$FN"
              echo "::notice::repair: $FN disalin paksa (dest ketinggalan)"
            fi
          done
          echo "::notice::dest manifest pasca-repair: $(grep -o '"game_version": *"[^"]*"' "$DEST/manifest.json" | head -1)"
          cd "$DEST"
          git config user.name "arena-ci" && git config user.email "ci@example.invalid"
          git add -A
          echo "::notice::content push: $(grep -o '"game_version": *"[^"]*"' manifest.json | head -1) — staged $(git diff --cached --name-only | wc -l) file"
          if git diff --cached --quiet; then
            echo "konten tidak berubah — tidak ada push"
          else
            git commit -m "konten game $(date -u +%Y-%m-%d) @${GITHUB_SHA:0:7}" -q
            git push origin content -q
            echo "konten terbit: manifest $(grep -o '"game_version": *"[^"]*"' manifest.json | head -1)"
          fi

      - name: Export APK Launcher + AIO (dengan diagnostik)
        run: |
          export OUTDIR="$GITHUB_WORKSPACE/exports/android"
          RC0=0; timeout 120 ./godot --headless --path project --quit > "$OUTDIR/quit.log" 2>&1 || RC0=$?
          RC=0; timeout 900 ./godot --headless --verbose --path project --export-debug "Android AIO" "$OUTDIR/ASekai.apk" > "$OUTDIR/export_aio.log" 2>&1 || RC=$?
          {
            echo "## Diagnostik build $GITHUB_SHA"
            echo "quit.rc=$RC0 export-aio.rc=$RC"
            echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
            ls "$ANDROID_SDK_ROOT/build-tools" 2>/dev/null | tail -2
            echo '### import.log (akhir)'; tail -6 "$GITHUB_WORKSPACE/import.log"
            echo '### export_aio.log (penuh)'
            sed 's/\x1b\[[0-9;]*m//g' "$OUTDIR/export_aio.log"
            echo '### preset head'
            head -14 project/export_presets.cfg
          } > "$OUTDIR/diag.txt" 2>&1
          echo "[diag] bytes: $(wc -c < "$OUTDIR/diag.txt")"
          ls -la "$OUTDIR/"

      - name: Terbitkan/perbarui Release + unggah aset (retry)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # 1) simpan diagnostik ke release notes (terbaca via API)
          if gh release edit "$TAG" --notes-file "$GITHUB_WORKSPACE/exports/android/diag.txt"; then
            echo "::notice::diagnostik tersimpan di release notes"
          else
            echo "::error::gh write ke release notes gagal (token?)"
            exit 1
          fi
          OUTDIR="$GITHUB_WORKSPACE/exports/android"
          if [ ! -s "$OUTDIR/ASekai.apk" ]; then
            echo "::notice::APK belum tersedia — lihat diagnostik di release notes"
            exit 0
          fi
          # 2) notes final + sha + upload aset dengan retry
          cd "$OUTDIR" && sha256sum ASekai.apk > "$GITHUB_WORKSPACE/SHA256SUMS.txt" && cd "$GITHUB_WORKSPACE"
          {
            echo "## Pulau Toon — APK debug (CI)"
            echo ""
            echo "Commit: \`$GITHUB_SHA\` — dibangun oleh GitHub Actions (runner full-internet)."
            echo ""
            echo "**A-Sekai.apk** — launcher + seluruh konten ter-bundle di SATU aplikasi."
            echo "Instal → langsung main offline; pembaruan konten berikutnya otomatis"
            echo "delta (hanya pack yang berubah) saat kamu menjalankan server konten (README §3)."
            echo ""
            echo "Install: unduh APK → izinkan sumber tak dikenal → buka (landscape)."
            echo "Detail: README.md §5–§8; bukti uji: docs/BUKTI_UJI.md."
            echo '### SHA-256'
            echo '```'; cat SHA256SUMS.txt; echo '```'
          } > notes.md
          gh release edit "$TAG" --notes-file notes.md
          for f in "$OUTDIR/ASekai.apk" "$GITHUB_WORKSPACE/SHA256SUMS.txt"; do
            ok=0
            for i in 1 2 3 4; do
              if OUT2=$(gh release upload "$TAG" "$f" --clobber 2>&1); then ok=1; echo "upload OK: $(basename "$f")"; break; fi
              echo "upload $(basename "$f") percobaan $i gagal: $(echo "$OUT2" | head -c 200)"; sleep 15
            done
            [ "$ok" = "1" ] || { echo "::error::gagal unggah $f — $(echo "$OUT2" | head -c 200)"; exit 1; }
          done
          # hapus aset legasi varian lama (bila masih menempel)
          for a in PulauToon-aio.apk PulauToon-debug.apk PulauToon.apk; do
            gh release delete-asset "$TAG" "$a" --yes 2>/dev/null && echo "aset legasi $a dihapus" || true
          done

