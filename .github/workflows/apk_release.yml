name: Android APK

on:
  push:
    branches:
      - main
      - arena/01a10152-unity
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/apk_release.yml"
  workflow_dispatch:

concurrency: android-apk

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Siapkan lisensi Unity
        env:
          UNITY_LICENSE_SECRET: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: bash .github/unity-builder-steps/prepare_license.sh

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Patch unity-builder v4 → aktivasi Personal via Licensing.Client
        run: |
          set -euo pipefail
          shopt -s nullglob
          CANDIDATES=( "$GITHUB_WORKSPACE"/../../_actions/game-ci/unity-builder/*/dist/platforms/ubuntu/steps )
          STEPS_DIR="${CANDIDATES[0]:-}"
          if [ -z "$STEPS_DIR" ] || [ ! -f "$STEPS_DIR/activate.sh" ]; then
            echo "::error::Folder steps game-ci/unity-builder tidak ditemukan."
            exit 1
          fi
          cp -v "$GITHUB_WORKSPACE/.github/unity-builder-steps/activate.sh"       "$STEPS_DIR/activate.sh"
          cp -v "$GITHUB_WORKSPACE/.github/unity-builder-steps/return_license.sh" "$STEPS_DIR/return_license.sh"
          chmod +x "$STEPS_DIR/activate.sh" "$STEPS_DIR/return_license.sh"

      - name: Build Stillwater Room APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ env.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildMethod: CiBuild.BuildAll
          versioning: None
          allowDirtyBuild: true
          # Nomor versi APK mengikuti nomor run GitHub Actions.
          customParameters: '-runNumber ${{ github.run_number }}'

      - name: Pastikan APK berhasil dibuat
        run: |
          ls -laR build/Android || true
          test -f build/Android/StillwaterRoom.apk

      - name: Terbitkan APK → release apk-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Build Stillwater Room otomatis #${{ github.run_number }} dari commit ${{ github.sha }}.
          Untuk update game, unduh APK terbaru dari release ini dan instal di HP."
          gh release view apk-latest >/dev/null 2>&1 || \
            gh release create apk-latest --title "Stillwater Room — APK Terbaru" --notes "$NOTES"
          gh release edit apk-latest --title "Stillwater Room — APK Terbaru" --notes "$NOTES"
          gh release delete-asset apk-latest UAL2Playground.apk --yes 2>/dev/null || true
          gh release upload apk-latest build/Android/StillwaterRoom.apk --clobber
