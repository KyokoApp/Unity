name: Android APK

# ============================================================
# Membangun APK Android dari HP, tanpa komputer.
#
# KENAPA INI BISA TANPA PC
# ------------------------
# Dulu game-ci butuh file .ulf yang hanya bisa dibuat lewat Unity Hub
# di komputer. Unity sudah MENCABUT aktivasi manual untuk lisensi
# Personal (license.unity3d.com/manual sekarang Enterprise/Industry
# saja), jadi jalur lama itu mati.
#
# Gantinya: game-ci/cli punya strategi "personal" yang mengambil seat
# langsung dari layanan lisensi Unity memakai email+password:
#   Unity.Licensing.Client --activate-all --include-personal
# Ditambahkan di game-ci/cli#246, merged 2026-09-05.
# unity-builder@v6 memakai cliVersion: latest, jadi dapat fitur ini.
#
# Sudah diverifikasi dari sumbernya (bukan dugaan):
#   dist/platforms/ubuntu/steps/licensing_method.sh -> rantai
#   file -> serial -> floating -> personal; kalau hanya UNITY_EMAIL
#   dan UNITY_PASSWORD yang ada, resolves ke "personal".
#
# ============================================================
# SECRET YANG WAJIB ADA
#   UNITY_EMAIL       email akun Unity
#   UNITY_PASSWORD    password akun Unity
#
# OPSIONAL
#   VRM_DRIVE_ID      ID file Google Drive dari AureliaChar.vrm.
#                     Kalau kosong -> APK memakai kapsul placeholder,
#                     BUKAN karakter anime.
#   ANDROID_KEYSTORE_BASE64 / _PASS / KEYALIAS_NAME / _PASS
#                     kalau kosong, APK ditandatangani debug keystore
#                     (bisa diinstal di HP sendiri, tidak bisa ke Play Store)
#
# PENTING SOAL LISENSI
#   Seat Personal itu TERPAKAI selama build dan dikembalikan sesudahnya.
#   game-ci memasang EXIT trap supaya seat kembali walau build gagal.
#   Kalau build berikutnya menolak karena "no seat available", jalankan
#   game-ci/unity-return-license atau tunggu beberapa menit.
#
# PENTING SOAL LISENSI KARAKTER
#   AureliaChar.vrm berlisensi Redistribution_Prohibited. Job "release"
#   di bawah MENOLAK jalan kalau repo ini masih publik dan VRM ikut
#   ter-build -- APK yang bisa diunduh publik = redistribusi.
#   Privatkan repo dulu: Settings -> General -> paling bawah -> Change visibility.
# ============================================================

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Nama versi (kosongkan = dev-<tanggal>)'
        required: false
        default: ''
      ikutVrm:
        description: 'Sertakan karakter VRM (butuh VRM_DRIVE_ID + repo privat)'
        required: false
        default: 'true'
      tanpaCel:
        description: 'Bangun TANPA shader cel (jika cel-shading yang mematikan build, ini tetap menghasilkan APK terpasang)'
        required: false
        default: 'false'
  push:
    tags: ['v*']

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.0.32f1

jobs:
  # ------------------------------------------------------------
  # Tes NUnit TIDAK dijalankan di sini. Alasannya: verify.yml sudah
  # menjalankan 46 tes yang sama tanpa Unity dalam ~1 menit, sedangkan
  # menjalankannya di dalam Unity butuh lisensi + container ~10 menit
  # untuk hasil yang sama. Membuang seat lisensi untuk itu tidak worth it.
  # ------------------------------------------------------------

  build:
    name: Build APK (ARM64, IL2CPP)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      # "vrmDipakai" = karakter BENAR-BENAR ada di APK (prefab terbentuk),
      # bukan cuma "file .vrm berhasil diunduh". Lihat langkah 'karakter'.
      vrmDipakai: ${{ steps.karakter.outputs.ada }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # ------------------------------------------------------------
      # Runner GitHub hanya MENJAMIN 14 GB disk. Image Unity untuk Android
      # berisi lib IL2CPP untuk SEMUA arsitektur (termasuk armeabi-v7a yang
      # tidak kita pakai), dan saat layer Docker-nya diekstrak butuh lebih
      # dari 14 GB. Build pertama gagal persis di situ:
      #   docker: failed to register layer: ...armeabi-v7a/libunityruntime.a
      #   no space left on device
      #
      # Jadi: buang software bawaan runner yang tidak dipakai job ini,
      # SEBELUM game-ci menarik image. Job ini tidak butuh dotnet/Android
      # SDK/ghc di host -- semuanya jalan di dalam container Unity.
      # ------------------------------------------------------------
      - name: Bebaskan ruang disk runner
        run: |
          df -h /
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost
          sudo apt-get clean || true
          sudo docker system prune -af || true
          df -h /

      # Cache Library/ -- tanpa ini setiap build mengimpor ulang semua aset
      # dari nol (~15-25 menit tambahan).
      - uses: actions/cache@v4
        with:
          path: Library
          # v2: cache Library dari run 5 terbukti bisa membuat IL2CPP
          # segfault (exit 139) saat assembly Runtime berubah di atas state
          # incremental build sebelumnya (run 6). Kunci baru = impor bersih.
          # v3: TANPA restore-keys. Cache Library yang basi bukan cuma lambat --
          # ia MEMBOHONG: run v0.2.0-cel-fix9 punya Library/ScriptAssemblies/RPG.Runtime.dll
          # sisa build sebelumnya, jadi pemeriksaan "dll ada = kompilasi lulus" berkata
          # LULUS padahal csc gagal hari itu juga. Lebih baik impor bersih (+8 menit)
          # daripada menatap结论 yang salah. Run 5 juga pernah kena IL2CPP segfault
          # akibat cache Library (lihat komentar di bawah), jadi ini bukan pertama kalinya
          # Library silang-build menyesatkan kita.
          key: Library-android-v3-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}

      # ---- keystore tetap supaya bisa update tanpa uninstall ----
      #
      # BUG LAMA (build fix..fix6): keystore dilempar sebagai *env var* ke langkah
      # game-ci. game-ci/unity-builder@v6 TIDAK membaca ANDROID_KEYSTORE_* dari env
      # -- ia memetakannya dari INPUT (dist/.../image-environment-factory.ts:
      # ANDROID_KEYSTORE_NAME <- parameters.androidKeystoreName). Jadi langkah itu
      # selalu lulus tanpa keluhan sementara Unity diam-diam memakai debug keystore,
      # dan debug keystore tiap runner berbeda -> Android menolak update
      # ("app not installed" / harus uninstall dulu). Perbaikan: pakai input.
      #
      # Keystore itu ada di repo (keystore/release.keystore) karena repo ini privat;
      # secret dipakai kalau terisi.
      - name: Siapkan keystore tetap
        id: ks
        env:
          KS_B64:        ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS_S:     ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KS_ALIAS_S:    ${{ secrets.ANDROID_KEYALIAS_NAME }}
          KS_ALIAS_PASS_S: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: |
          set -e
          KS=keystore/release.keystore
          if [ -n "$KS_B64" ]; then
            mkdir -p keystore
            printf '%s' "$KS_B64" | base64 -d > "$KS"
            echo "ANDROID_KEYSTORE_PASS=$KS_PASS_S"       >> "$GITHUB_ENV"
            echo "ANDROID_KEYALIAS_NAME=$KS_ALIAS_S"      >> "$GITHUB_ENV"
            echo "ANDROID_KEYALIAS_PASS=$KS_ALIAS_PASS_S" >> "$GITHUB_ENV"
            echo "pakai=secret" >> "$GITHUB_OUTPUT"
          elif [ -f "$KS" ]; then
            echo "ANDROID_KEYSTORE_PASS=yuki123"      >> "$GITHUB_ENV"
            echo "ANDROID_KEYALIAS_NAME=yuki"         >> "$GITHUB_ENV"
            echo "ANDROID_KEYALIAS_PASS=yuki123"      >> "$GITHUB_ENV"
            echo "pakai=repo" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Tidak ada keystore (secret kosong dan $KS tidak ada) -> debug keystore acak; tiap build dianggap aplikasi berbeda."
            echo "pakai=debug" >> "$GITHUB_OUTPUT"
          fi
          # Validasi DULU, sebelum 12 menit terbuang. Dua kegagalan yang pernah
          # terjadi di sini: file LFS pointer (text, ~130 byte) dan keystore yang
          # tidak bisa dibaca JDK. Kalau ini lolos, signing pasti punya bahan.
          if [ -f "$KS" ]; then
            SZ=$(stat -c%s "$KS")
            B0=$(od -An -tx1 -N1 "$KS" | tr -d ' ')
            echo "keystore $KS: ${SZ} byte, byte pertama 0x${B0}"
            if [ "${B0}" != "30" ] || [ "$SZ" -lt 1000 ]; then
              echo "::error::$KS bukan keystore DER (size=${SZ}, byte0=0x${B0}). Kemungkinan ini LFS pointer: jalankan 'git lfs pull' / cek .gitattributes."
              exit 1
            fi
            # Path ABSOLUT seperti yang dilihat container: dockerWorkspacePath
            # default /github/workspace (docker.ts: --volume "$workspace":/github/workspace),
            # jadi inilah jalan sebenarnya ke berkas yang sama. PlayerSettings.Android.keystoreName
            # hanya menyimpan string dan diteruskan apa adanya ke Gradle -- kalau relatif,
            # ia diresolve terhadap folder yang bukan workspace Unity di dalam container.
            echo "ANDROID_KEYSTORE_NAME=/github/workspace/keystore/release.keystore" >> "$GITHUB_ENV"
          fi
          # Logs/ = tempat Unity menulis lognya (lihat -logfile di langkah build).
          # Harus ada SEBELUM container jalan; editor tidak membuat foldernya.
          mkdir -p Logs

      # ---- versionCode + versionName ----
      # Android menolak update kalau versionCode tidak naik, dan menolak instalasi
      # kalau paket yang sudah terpasang ditandatangani kunci lain. Keduanya adalah
      # "error mulu" yang dilaporkan pengguna, jadi keduanya dikontrol di sini.
      # game-ci membaca versionCode dari INPUT androidVersionCode (-> -androidVersionCode),
      # ProjectSettings juga ikut ditulis supaya build manual di Editor sama.
      - name: Naikkan versionCode + versionName
        run: |
          set -e
          FILE=ProjectSettings/ProjectSettings.asset
          VC=$(( ${{ github.run_number }} + 1000 ))
          echo "ANDROID_VERSION_CODE=$VC" >> "$GITHUB_ENV"
          echo "Set AndroidBundleVersionCode=$VC"
          sed -i -E "s/AndroidBundleVersionCode: [0-9]+/AndroidBundleVersionCode: $VC/" "$FILE"
          if [ -n "${{ github.event.inputs.versionName }}" ]; then
            VN="${{ github.event.inputs.versionName }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            VN="${GITHUB_REF_NAME#v}"
          else
            VN="0.2.0-dev.${{ github.run_number }}"
          fi
          echo "Set bundleVersion=$VN"
          sed -i -E "s/bundleVersion: .*/bundleVersion: $VN/" "$FILE"
          # app ID tidak boleh berubah lagi: ganti package = aplikasi baru di HP,
          # lama tetap terpasang, keduanya berkelahi memperebutkan nama yang sama.
          sed -i -E "s/^(  )applicationIdentifier:/\1applicationIdentifier:/" "$FILE"
          grep -E "bundleVersion|AndroidBundleVersionCode|applicationIdentifier|packageName" "$FILE" | head -8

      # ---- karakter VRM, diunduh saat build, tidak pernah masuk git ----
      - name: Ambil AureliaChar.vrm dari Drive
        id: vrm
        env:
          DRIVE_ID: ${{ secrets.VRM_DRIVE_ID }}
        run: |
          set -e
          mkdir -p Assets/Art/Characters
          # Sumber 1: sudah ada di repo (kalau repo privat dan kamu commit
          # sendiri file-nya, misalnya lewat Git LFS). Tidak perlu diunduh.
          if [ -f Assets/Art/Characters/AureliaChar.vrm ]; then
            SZ=$(stat -c%s Assets/Art/Characters/AureliaChar.vrm)
            echo "dipakai=true" >> "$GITHUB_OUTPUT"
            echo "VRM sudah ada di repo: ${SZ} byte -- tidak mengunduh dari Drive."
            exit 0
          fi
          if [ "${{ github.event.inputs.ikutVrm }}" = "false" ]; then
            echo "dipakai=false" >> "$GITHUB_OUTPUT"; echo "VRM dilewati (input ikutVrm=false)"; exit 0
          fi
          if [ -z "$DRIVE_ID" ]; then
            echo "dipakai=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret VRM_DRIVE_ID kosong. APK memakai kapsul placeholder, bukan karakter anime."
            exit 0
          fi
          # File 15 MB ada di bawah ambang scan-virus Drive (~100 MB), jadi
          # unduhan langsung seharusnya jalan. Fallback cookie+confirm tetap
          # disertakan karena Drive suka mengubah perilakunya.
          URL="https://drive.google.com/uc?export=download&id=${DRIVE_ID}"
          curl -sSL -o vrm.bin "$URL" || true
          if ! head -c 4 vrm.bin | grep -q 'glTF'; then
            echo "  unduhan pertama bukan glTF, coba dengan confirm token..."
            rm -f vrm.bin cookies.txt
            curl -sSL -c cookies.txt -o vrm.bin "$URL" || true
            CONFIRM=$(grep -oP 'confirm=\K[0-9A-Za-z_-]+' cookies.txt 2>/dev/null | head -1 || true)
            [ -n "$CONFIRM" ] && curl -sSL -b cookies.txt -o vrm.bin "${URL}&confirm=${CONFIRM}" || true
            rm -f cookies.txt
          fi
          if head -c 4 vrm.bin | grep -q 'glTF'; then
            mv vrm.bin Assets/Art/Characters/AureliaChar.vrm
            SZ=$(stat -c%s Assets/Art/Characters/AureliaChar.vrm)
            echo "dipakai=true" >> "$GITHUB_OUTPUT"
            echo "VRM terpasang: ${SZ} byte"
            # glTF/VRM = arsip ZIP-ish; 15 MB wajar. Di bawah 5 MB = pasti salah.
            if [ "$SZ" -lt 5000000 ]; then
              echo "::error::Ukuran VRM ${SZ} byte terlalu kecil (harusnya ~15 MB). Unduhan rusak."
              exit 1
            fi
          else
            rm -f vrm.bin
            echo "dipakai=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Gagal mengambil VRM dari Drive. APK memakai kapsul placeholder."
            echo "            Cek: (1) VRM_DRIVE_ID benar? ID ada di URL drive.google.com/file/d/<ID>/view"
            echo "                 (2) file di-share 'Anyone with the link'?"
            echo "                 (3) kalau tetap gagal, commit AureliaChar.vrm ke repo PRIVAT"
            echo "                     (Git LFS sudah dikonfigurasi di .gitattributes) -- langkah"
            echo "                     'sumber 1' di atas akan memakainya dan melewati Drive."
          fi

      # ---- katup pelarian: build tanpa cel-shading ----
      # Shader tidak bisa diuji di luar Unity, dan enam build terakhir mati tanpa
      # satu pun baris penjelas. Kalau lagi-lagi exit 1, jalankan workflow ini lagi
      # dengan tanpaCel=true: kalau yang ini hijau, pelakunya pasti salah satu shader
      # Aurelia*Cel -- dan APK-nya tetap bisa dipasang, cuma tanpa gaya Genshin.
      - name: Lepas cel-shading (kalau diminta)
        if: ${{ github.event.inputs.tanpaCel == 'true' }}
        run: |
          set -e
          ls Assets/_Project/Shaders/Aurelia*Cel.shader 2>/dev/null || true
          rm -f Assets/_Project/Shaders/AureliaCharCel.shader \
                Assets/_Project/Shaders/AureliaTerrainCel.shader \
                Assets/_Project/Shaders/AureliaWaterCel.shader \
                Assets/_Project/Shaders/AureliaGrassCel.shader
          echo "::warning::cel-shading dilepas untuk build ini -- material jatuh kembali ke shader Aurelia/* non-cel."

      # ------------------------------------------------------------
      # UJI KESTORE DENGAN JDK-NYA SENDIRI -- sebelum Unity start.
      #
      # Run v0.2.0-cel-fix13 bertahan 30 menit (kompilasi LULUS, IL2CPP LULUS,
      # Gradle LULUS) lalu mati di baris paling akhir:
      #
      #     UnityException: Can not sign the application
      #
      # Tidak ada detail: Unity hanya bilang "tidak bisa menandatangani". Satu-
      # satunya pertanyaan yang tersisa adalah apakah JDK pembaca PKCS12 kami
      # menerima berkas + password + alias ini. Pertanyaan itu dijawab keytool
      # dalam 5 detik, memakai JDK yang sama-sama dipakai toolchain Android --
      # jadi keputusannya diambil SEBELUM 30 menit, bukan sesudahnya, dan dengan
      # pesan Java yang sebenarnya ("keystore password was incorrect", "UnrecoverableKeyException",
      # "algorithm ... not available") alih-alih satu baris tanpa sebab.
      #
      # Kalau JDK menolak: kita bangun keystore baru dengan keytool-nya juga, jadi
      # build tetap menghasilkan APK yang tertandatangani. Harganya dicatat jujur
      # di anotasi: kunci baru = sekali install perlu uninstall.
      # ------------------------------------------------------------
      # ------------------------------------------------------------
      # UJI KESTORE DENGAN JDK-NYA SENDIRI -- sebelum Unity start.
      #
      # Run v0.2.0-cel-fix13 bertahan 30 menit (kompilasi LULUS, IL2CPP LULUS,
      # Gradle LULUS) lalu mati di baris paling akhir:
      #
      #     UnityException: Can not sign the application
      #
      # Unity tidak menambahkan apa pun. Satu-satunya pertanyaan yang tersisa:
      # mampukah toolchain Java di runner membaca keystore ini DAN menandatangani
      # sesuatu dengannya? Dua tes di bawah menjawabnya dalam ~5 detik --
      # `keytool -list` (baca: berkas + storepass + alias) dan `jarsigner`
      # (pakai kunci privat + rantai sertifikat + algoritma tanda tangan, yaitu
      # persis langkah yang gagal di Unity). Kalau keduanya lulus sementara Unity
      # tetap gagal, penyebabnya bukan filenya tapi KONFIGURASI di sekitarnya
      # (bentuk path keystoreName), dan anotasi 'unityAkanPakai' di bawah
      # menunjukkan string persis yang dikirim.
      #
      # Kalau JDK menolak: dibuat keystore cadangan DENGAN keytool yang sama, jadi
      # build tetap menghasilkan APK bertanda tangan. Harganya dicatat jujur:
      # kunci berbeda = sekali install perlu uninstall.
      # ------------------------------------------------------------
      - name: Uji keystore dengan JDK runner
        id: kstest
        run: |
          set +e
          HOST_KS="keystore/release.keystore"
          if [ ! -f "$HOST_KS" ]; then
            echo "::warning::tidak ada $HOST_KS -> Unity akan memakai debug keystore (kunci baru tiap build)."
            exit 0
          fi
          KT="$(command -v keytool)"
          if [ -z "$KT" ]; then
            for d in "$JAVA_HOME/bin" /usr/lib/jvm /usr/local/lib/jvm /opt/java; do
              c=$(find "$d" -maxdepth 3 -name keytool -type f 2>/dev/null | head -1)
              [ -x "$c" ] && KT="$c" && break
            done
          fi
          if [ -z "$KT" ]; then
            echo "::warning::keytool tidak ditemukan -> keystore tidak bisa diuji lebih dulu."
            exit 0
          fi
          echo "keytool: $KT ($("$KT" -version 2>&1 | head -1))"
          echo "menguji $HOST_KS: dibaca, lalu dipakai menandatangani"

          KS_OK=0
          if "$KT" -list -keystore "$HOST_KS" -storepass "$ANDROID_KEYSTORE_PASS" \
                  -alias "$ANDROID_KEYALIAS_NAME" > /tmp/keytool.txt 2>&1; then
            KS_OK=1
            echo "=== keytool menerima ==="; head -4 /tmp/keytool.txt
            echo "::notice::baca OK. unityAkanPakai: androidKeystoreName=${ANDROID_KEYSTORE_NAME} alias=${ANDROID_KEYALIAS_NAME}"
          else
            echo "=== keytool MENOLAK ==="; head -14 /tmp/keytool.txt
            echo "::error::JDK menolak keystore: $(head -3 /tmp/keytool.txt | tr '\n' ' ' | cut -c1-240)"
          fi

          JARBIN="$(dirname "$KT")/jarsigner"
          if [ -x "$JARBIN" ]; then
            rm -rf /tmp/sigtest && mkdir -p /tmp/sigtest/META-INF
            printf 'Manifest-Version: 1.0\nCreated-By: aurelia-ci\n\n' > /tmp/sigtest/META-INF/MANIFEST.MF
            (cd /tmp/sigtest && zip -qr unsigned.jar META-INF)
            "$JARBIN" -keystore "$HOST_KS" -storepass "$ANDROID_KEYSTORE_PASS" \
                     -keypass "$ANDROID_KEYALIAS_PASS" \
                     -signedjar /tmp/sigtest/signed.jar \
                     /tmp/sigtest/unsigned.jar "$ANDROID_KEYALIAS_NAME" > /tmp/sig.txt 2>&1
            if [ -s /tmp/sigtest/signed.jar ]; then
              KS_OK=1
              echo "=== jarsigner menerima ==="; head -4 /tmp/sig.txt
              echo "::notice::jarsigner SUKSES -> berkas, password, alias, dan kunci privat sehat. Kalau Unity tetap 'Can not sign', yang salah adalah cara path/flag diberikan, bukan isinya."
            else
              KS_OK=0
              echo "=== jarsigner MENOLAK ==="; head -10 /tmp/sig.txt
              echo "::error::jarsigner gagal: $(head -5 /tmp/sig.txt | tr '\n' ' ' | cut -c1-280)"
            fi
          else
            echo "::warning::jarsigner tidak ada di samping keytool -> hanya tes baca yang dijalankan."
          fi

          if [ "$KS_OK" != "1" ]; then
            ALT="keystore/ci-generated.keystore"
            "$KT" -genkeypair -noprompt -storetype PKCS12 \
                  -dname "CN=yuki, OU=natsuki, O=yuki, L=Jakarta, C=ID" \
                  -validity 9125 -keyalg RSA -keysize 2048 -sigalg SHA256withRSA \
                  -alias yuki -keystore "$ALT" -storepass yuki123 -keypass yuki123 > /tmp/gen.txt 2>&1
            if [ -s "$ALT" ] && "$KT" -list -keystore "$ALT" -storepass yuki123 -alias yuki > /dev/null 2>&1; then
              echo "ANDROID_KEYSTORE_NAME=/github/workspace/$ALT" >> "$GITHUB_ENV"
              echo "ANDROID_KEYSTORE_PASS=yuki123" >> "$GITHUB_ENV"
              echo "ANDROID_KEYALIAS_NAME=yuki" >> "$GITHUB_ENV"
              echo "ANDROID_KEYALIAS_PASS=yuki123" >> "$GITHUB_ENV"
              echo "::warning::keystore release tidak bisa dipakai, jadi build ini menandatangani dengan $ALT (dibuat keytool runner). APK terpasang, tapi kuncinya BEDA dari build lain: uninstall sekali, dan simpan $ALT / isinya ke secret ANDROID_KEYSTORE_BASE64 supaya build berikutnya konsisten."
            else
              head -6 /tmp/gen.txt
              echo "::error::keystore cadangan pun gagal dibuat -- build kemungkinan mati di signing lagi."
            fi
          fi

      - name: Build Android
        uses: game-ci/unity-builder@v6
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          # Tidak diset -> licensing_method.sh resolve ke "personal".
          # Jangan isi UNITY_LICENSE kecuali kamu memang punya .ulf.
          UNITY_LICENSING_METHOD: personal
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          # DIPINJAM. Default 'latest' berarti action memanggil
          # https://api.github.com/repos/game-ci/cli/releases/latest dari runner --
          # dan api.github.com menjawab 403 (rate limit) tepat di run v0.2.0-cel-fix11,
          # 90 detik sebelum Unity sempat mulai: bukan salah proyek ini, tapi
          # dependensi jaringan yang tidak perlu. v0.1.65 (2026-09-15) sudah
          # memuat game-ci/cli#246 -- strategi lisensi 'personal' yang workflow ini
          # andalkan -- jadi pin ini tidak mengorbankan apa pun. Naikkan
          # sengaja, sekali, lewat pull request: bukan kejutan jam 3 pagi.
          cliVersion: v0.1.65
          # APK, bukan .aab. `androidBuildAppBundle` BUKAN input v6 (anotasi CI:
          # "Unexpected input(s) 'androidBuildAppBundle'") -- yang benar androidExportType,
          # dan 'androidPackage'-lah yang membuat EditorUserBuildSettings.buildAppBundle=false.
          androidExportType: androidPackage
          androidVersionCode: ${{ env.ANDROID_VERSION_CODE }}
          # Keystore HARUS lewat input ini (lihat langkah 'Siapkan keystore tetap').
          androidKeystoreName: ${{ env.ANDROID_KEYSTORE_NAME }}
          androidKeystorePass: ${{ env.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ env.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ env.ANDROID_KEYALIAS_PASS }}
          androidTargetSdkVersion: AndroidApiLevelAuto
          allowDirtyBuild: true             # folder VRM hasil unduhan membuat tree kotor
          # JANGAN pernah menambah -logfile di sini. Dua percobaan, dua pelajaran:
          #   fix7/fix8: "-logfile <path>" diabaikan (yang pertama punyanya game-ci menang),
          #                jadi Logs/AureliaEditor.log tidak pernah ada;
          #   fix12: ternyata tidak diabaikan -- parser argumen game-ci
          #                (UnityBuilderAction) membangun Dictionary dari argumen
          #                baris perintah dan MELEMPAR "An item with the same key has
          #                already been added. Key: logfile", jadi BuildProject mati
          #                SEBELUM build player dimulai. Kunci ganda = exception,
          #                bukan "yang terakhir menang" seperti dugaan kita.
          # Log Unity tetap didapat lewat AureliaCILogTap (Application.logMessage-
          # ReceivedThreaded -> Logs/AureliaUnity.log di root project, yang ikut
          # ter-mount ke host) -- terbukti bekerja di run fix12: dari sanalah baris
          # "Key: logfile" di atas terbaca.
          customParameters: >-
            -scriptingBackend IL2CPP
            -androidBuildSystem Gradle
            -androidArchitecture ARM64
            -androidCreateSymbols Disabled

      # ------------------------------------------------------------
      # MATALOG: ubah log Unity jadi anotasi yang bisa dibaca mesin.
      #
      # Kenapa bukan sekadar upload artifact: enam build terakhir gagal semua dan
      # satu-satunya hal yang dilaporkan adalah "Build failed with exit code 1" --
      # log mentahnya (results-receiver.actions.githubusercontent.com -> blob
      # storage) tidak selalu bisa diambil oleh alat otomatis. Anotasi API
      # (check-runs/{id}/annotations) selalu bisa. Jadi baris penentunya kita
      # SEMBUNKAN ke anotasi, bukan cuma ke artifact.
      # ------------------------------------------------------------
      # ------------------------------------------------------------
      # FORENSIK: cari sebab kegagalan di seluruh workspace, lalu
      # SEMBUNKAN ke anotasi.
      #
      # Kenapa bukan baca log Actions saja: Unity dijalanakan game-ci dengan
      # "-logfile /dev/stdout" (cli: dist/platforms/ubuntu/steps/build.sh), jadi
      # tidak pernah ada Editor.log di disk; dan log mentah Actions diarahkan ke
      # blob storage yang tidak selalu bisa diambil alat otomatis. Anotasi API
      # (check-runs/{id}/annotations) SELALU bisa dibaca -- jadi di sinilah
      # sebab sebenarnya dikeluarkan.
      #
      # -logfile di customParameters tetap dicoba (kalau editor mulai
      # menghormati yang terakhir, kita dapat log utuhnya di Logs/).
      # ------------------------------------------------------------
      # ------------------------------------------------------------
      # BUKTI. Sumber utama: Logs/AureliaUnity.log -- kran log yang dipasang
      # AureliaCILogTap.cs di dalam Editor. Kenapa perlu: game-ci menjalankan
      # Unity dengan "-logfile /dev/stdout" (cli: dist/platforms/ubuntu/steps/
      # build.sh) sehingga Unity TIDAK pernah menulis Editor.log ke disk, dan
      # menimpanya lewat customParameters terbukti tidak mempan (dicoba di run
      # v0.2.0-cel-fix7 + fix8: Logs/AureliaEditor.log tidak pernah dibuat).
      # Anotasi = saluran yang selalu bisa dibaca alat otomatis; log mentah
      # Actions diarahkan ke blob storage yang tidak selalu bisa diambil.
      #
      # Kalau blok ini berbunyi "LogTap tidak terpasang" padahal kompilasi LULUS,
      # curigai argumen baris perintah ganda: UnityBuilderAction membangun
      # Dictionary dari argv, dan kunci ganda (mis. -logfile dua kali) melempar
      # ArgumentException SEBELUM build player mulai -- itu yang terjadi di fix12.
      # ------------------------------------------------------------
      - name: Kumpulkan bukti kegagalan (anotasi + artifact)
        if: always()
        run: |
          df -h /
          set +e
          mkdir -p logs
          PAT='\] (Error|Exception|Assert):|error CS[0-9]|Scripts have compiler errors|Shader error|extra field|BuildFailedException|Error building player|keystore password|no available seats|Gradle build|FAILURE: Build|Aborting batchmode'

          emit() {  # $1=prefix $2=baris -> satu anotasi, dibersihkan dari karakter perintah workflow
            safe=$(printf '%s' "$2" | tr -d '\r\n' | cut -c1-460 | sed -e 's/::/-:/g' -e 's/%/25/g')
            echo "::error::$1 $safe"
          }

          TAP=Logs/AureliaUnity.log
          if [ -f "$TAP" ]; then
            echo "=== kran log Unity: $(stat -c%s "$TAP") byte, $(wc -l < "$TAP") baris ==="
            cp "$TAP" logs/
            grep -anE "$PAT" "$TAP" | tail -20 > logs/evidence.txt
            while IFS= read -r l; do emit "unity:" "$l"; done < logs/evidence.txt
            echo "--- 50 baris terakhir kran log ---"; tail -50 "$TAP"
          else
            echo "::warning::$TAP tidak ada -> LogTap tidak terpasang: RPG.Editor.dll tidak dikompilasi, atau build mati SEBELUM domain script dimuat (lisensi/impor)."
          fi

          # Konteks: satu baris error tanpa stack-tetangga hampir tidak pernah
          # cukup (lihat 'Can not sign the application' di fix13 -- penyebabnya
          # ada di baris-baris SEBELUMNYA). Ambil ±10 baris di sekitar error fatal
          # pertama sebagai satu anotasi panjang.
          if [ -f "$TAP" ]; then
            LINE=$(grep -anE '\] (Error|Exception):' "$TAP" | tail -1 | cut -d: -f1)
            if [ -n "$LINE" ]; then
              CTX=$(sed -n "$((LINE>10 ? LINE-10 : 1)),$((LINE+6))p" "$TAP" | tr '\n' '|' | cut -c1-1400)
              echo "::error::konteks sekitar baris $LINE: ${CTX}"
            fi
          fi

          # Jaring kedua, HANYA berkas log. Run fix8 grep tanpa --include sehingga
          # ikut mencocokkan teks di source PackageCache dan isi biner .dll:
          # anotasi penuh sampah, pesan asli tenggelam.
          found=$(timeout 200 grep -rlaE "$PAT" \
                    --include='*.log' --include='*.txt' --include='*.out' --include='*.json' \
                    --exclude-dir=.git Logs Library/Logs Library/Bee Temp build 2>/dev/null | head -6)
          for f in $found; do
            [ "$f" = "$TAP" ] && continue
            echo "=== $f ==="
            cp "$f" logs/ 2>/dev/null
            # HANYA error: run fix10 menenggelamkan pesan asli di bawah
            # CS0618 dari berkas punyanya game-ci yang kebetulan juga ikut ter-grep.
            # Format kanonik Unity/MSBuild: "Assets/.../File.cs(12,34): error CS0246: ...".
            # Di berkas JSON ia terkubur dalam satu baris panjang, jadi grep -o yang diambil,
            # bukan seluruh baris (run fix9 memotong pesan di 460 karakter pertama, yang
            # isinya cuma nama node -- persis pesan yang kita butuhkan jatuh di luar potongan).
            timeout 40 grep -aoE '[A-Za-z0-9_./\\-]+\.cs\([0-9]+,[0-9]+\): error CS[0-9]+: [^"\\]{0,300}' "$f" 2>/dev/null \
              | sort -u | head -14 > logs/hit.txt
            if [ ! -s logs/hit.txt ]; then
              timeout 40 grep -aoE 'error CS[0-9]+: [^"\\]{0,300}' "$f" 2>/dev/null | sort -u | head -14 > logs/hit.txt
            fi
            while IFS= read -r l; do emit "kompilasi:" "$l"; done < logs/hit.txt
            cat logs/hit.txt
            # Jejak node yang gagal (csc exitcode != 0) -- menyebut assembly mana.
            timeout 40 grep -aoE '"annotation":"[^"]{0,180}"' "$f" 2>/dev/null | sort -u | head -6
          done

          # Penanda paling andal untuk "kompilasi gagal": assembly Editor/Runner.
          # Kalau berkasnya tidak ada, build player PASTI mati -- dan itu menjelaskan
          # kenapa LogTap juga tidak sempat terpasang.
          for a in RPG.Core RPG.Runtime RPG.Editor; do
            f="Library/ScriptAssemblies/$a.dll"
            if [ -f "$f" ]; then
              # "ada" tidak cukup: Library bisa dipulihkan dari cache sehingga dll ini sisa
              # build LAMA. Yang berarti: dll lebih baru daripada semua sumbernya.
              tua=$(find Assets -name '*.cs' -newer "$f" 2>/dev/null | head -1)
              if [ -n "$tua" ]; then
                emit "dll-basi:" "$a.dll ($(date -r "$f" +%H:%M:%S)) lebih TUA dari $tua -> dll ini sisa cache, kompilasi assembly ini GAGAL"
              else
                echo "::notice::$a.dll $(stat -c%s "$f") byte, lebih baru dari semua sumber -> kompilasi LULUS"
              fi
            else
              emit "berkas:" "$a.dll HILANG di Library/ScriptAssemblies -> assembly ini tidak selesai dikompilasi"
            fi
          done
          { echo "== Library/ScriptAssemblies =="; ls -la Library/ScriptAssemblies 2>/dev/null | head -25;
            echo "== Logs =="; ls -la Logs 2>/dev/null;
            echo "== Library/Logs =="; ls -la Library/Logs 2>/dev/null;
            echo "== build/ =="; find build -maxdepth 2 2>/dev/null | head -20; } > logs/inventory.txt
          cat logs/inventory.txt
          echo "=== logs/evidence.txt ==="; cat logs/evidence.txt 2>/dev/null | head -40
          du -sh logs 2>/dev/null
          true

      - name: Upload log Unity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7

      # UniVRM mengekstrak tekstur .vrm secara sinkron, tapi membuat prefab-nya
      # lewat EditorApplication.delayCall -- yang tidak pernah jalan di batchmode.
      # VrmPrefabBuilder (dipanggil AureliaBuildPreprocessor) mengerjakan bagian
      # itu secara sinkron. Tanpa langkah ini, build CI ke-4 menghasilkan APK 25 MB
      # berisi KAPSUL, dan tidak ada satu pun langkah yang mengeluh.
      - name: Pastikan karakter benar-benar masuk build
        id: karakter
        run: |
          set -e
          PREFAB=Assets/Art/Characters/AureliaChar.prefab
          if [ -f "$PREFAB" ]; then
            echo "ada=true" >> "$GITHUB_OUTPUT"
            echo "Prefab karakter terbentuk: $(stat -c%s "$PREFAB") byte"
            ls Assets/Art/Characters/AureliaChar.Textures 2>/dev/null | wc -l | xargs echo "jumlah tekstur:"
          else
            echo "ada=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Prefab karakter tidak terbentuk -- APK berisi kapsul placeholder."
          fi
          # VRM sudah terunduh tapi prefab tidak jadi = bug, bukan nasib.
          # Lebih baik build gagal di sini daripada APK tanpa karakter dirilis.
          if [ "${{ steps.vrm.outputs.dipakai }}" = "true" ] && [ ! -f "$PREFAB" ]; then
            echo "::error::VRM terunduh (${{ steps.vrm.outputs.dipakai }}) tapi $PREFAB tidak terbentuk."
            echo "        Lihat log langkah 'Build Android', cari baris '[Aurelia]'."
            exit 1
          fi

      # AureliaBuildPreprocessor membangun scene + mendaftarkannya sebelum
      # build. Kalau ia gagal, APK-nya kosong -- jadi periksa di sini.
      - name: Pastikan APK ada dan tidak kosong
        run: |
          set -e
          APK=$(find build -name '*.apk' | head -1)
          test -n "$APK" || { echo "::error::APK tidak ditemukan di build/"; exit 1; }
          SZ=$(stat -c%s "$APK")
          echo "APK: $APK ($((SZ/1024/1024)) MB)"
          # APK Unity tanpa konten ~25 MB (engine saja). Dengan karakter VRM
          # (15 MB tekstur + mesh) harusnya jauh di atas itu.
          MIN=15000000
          if [ -f Assets/Art/Characters/AureliaChar.prefab ]; then MIN=30000000; fi
          if [ "$SZ" -lt "$MIN" ]; then
            echo "::error::APK hanya $((SZ/1024/1024)) MB -- kemungkinan scene kosong."
            exit 1
          fi
          if [ "${{ github.event_name }}" = "push" ]; then VER="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ github.event.inputs.versionName }}" ]; then VER="${{ github.event.inputs.versionName }}"
          else VER="dev-$(date -u +%Y%m%d-%H%M)"; fi
          echo "VERSION=$VER" >> "$GITHUB_ENV"
          mkdir -p release && cp "$APK" "release/aurelia-${VER}-arm64.apk"
          ls -la release/

      # ------------------------------------------------------------
      # BUKTI SUDAH DIPINJAM: siapa yang menandatangani APK ini?
      #
      # Semua "harus uninstall dulu / app not installed" bermuara ke satu hal:
      # apakah kunci penandatangan SAMA antar build. Kalau langkah 'Siapkan
      # keystore tetap' diam-diam jatuh ke debug keystore, APK-nya tetap hijau
      # dan tetap bisa diunduh -- yang gagal adalah INSTALASI di HP, dan itu
      # tidak kelihatan dari CI sama sekali. Jadi sertifikat di dalam APK dibaca
      # di sini dan dikeluarkan sebagai anotasi: CN=yuki = kunci repo; kalau
      # muncul CN=Android Debug, berarti fallback debug yang kepakai.
      # ------------------------------------------------------------
      - name: Verifikasi penandatangan APK
        run: |
          set +e
          # Path ABSOLUT: langkah ini beberapa kali berpindah direktori, dan
          # OLDPWD hanya menyimpan direktor SEBELUM cd terakhir -- mengandalkannya
          # untuk "$OLDPWD/$APK" akan menunjuk ke /tmp dan diam-diam tidak
          # menemukan apa-apa.
          APK=$(find "$GITHUB_WORKSPACE/build" -name '*.apk' | head -1)
          [ -f "$APK" ] || { echo "::warning::tidak ada APK untuk diverifikasi"; exit 0; }
          cd /tmp && rm -rf sigchk && mkdir sigchk && cd sigchk
          unzip -o -q "$APK" 'META-INF/*' 2>/dev/null
          CERT=$(ls META-INF/*.RSA META-INF/*.DSA 2>/dev/null | head -1)
          if [ -z "$CERT" ]; then
            echo "::error::tidak ada blok sertifikat di APK -> kemungkinan unsigned; tidak akan bisa dipasang"
            exit 1
          fi
          openssl pkcs7 -inform DER -in "$CERT" -print_certs -noout > c.pem 2>/dev/null
          SUBJ=$(openssl x509 -in c.pem -noout -subject -issuer -dates 2>/dev/null | tr '\n' ' ')
          echo "penandatangan: $SUBJ"
          echo "::notice::APK ditandatangani: ${SUBJ:0:240}"
          case "$SUBJ" in
            *"Android Debug"*) echo "::error::APK ditandatangani debug key (CN=Android Debug) -> tiap build kunci baru -> install timpa akan DITOLAK. Isi secret ANDROID_KEYSTORE_* atau pastikan keystore/release.keystore terpakai.";;
            *"CN = yuki"*|*"CN=yuki"*) echo "OK: kunci release repo dipakai; update antar build bisa dipasang tanpa uninstall.";;
            *) echo "::warning::penandatangan bukan CN=yuki -- periksa langkah 'Siapkan keystore tetap' (output: pakai=repo/secret/debug).";;
          esac
          # Skema v2 = yang dipakai Android 11+; APK yang cuma punya META-INF (v1)
          # sering ditolak diam-diam di Android baru. Magic 'APK Sig Block 42' duduk
          # tepat sebelum Central Directory, jadi cukup dilihat di ekor berkas.
          if tail -c 4096 "$APK" | grep -qa 'APK Sig Block 42'; then
            echo "v2 signing block: ADA"
          else
            echo "::warning::tidak ditemukan APK Signing Block -> hanya skema v1; di Android 11+ ini bisa ditolak"
          fi
          unzip -l "$APK" | grep -c 'META-INF' | xargs echo "entri META-INF:"
          cd /tmp && rm -rf sigchk
          openssl pkcs7 -inform DER -in "$CERT" -print_certs -noout > c.pem 2>/dev/null
          SUBJ=$(openssl x509 -in c.pem -noout -subject -issuer -dates 2>/dev/null | tr '\n' ' ')
          echo "penandatangan: $SUBJ"
          echo "::notice::APK ditandatangani: ${SUBJ:0:240}"
          case "$SUBJ" in
            *"Android Debug"*) echo "::error::APK ditandatangani debug key (CN=Android Debug) -> tiap build kunci baru -> install timpa akan DITOLAK. Isi secret ANDROID_KEYSTORE_* atau pastikan keystore/release.keystore terpakai.";;
            *"CN = yuki"*|*"CN=yuki"*) echo "OK: kunci release repo dipakai; update antar build bisa dipasang tanpa uninstall.";;
            *) echo "::warning::penandatangan bukan CN=yuki -- periksa langkah 'Siapkan keystore tetap' (output: pakai=repo/secret/debug).";;
          esac
          # Skema v2/v3 = yang dipakai Android 11+; kalau cuma ada META-INF (v1),
          # instalasi di Android baru bisa gagal meski APK-nya "berhasil dibangun".
          unzip -l "$APK" | grep -c "META-INF" | xargs echo "jumlah entri META-INF:"

      # Artifact hanya bisa diunduh orang yang punya akses repo.
      # Ini jalur unduh yang AMAN walau repo masih publik.
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: release/*.apk
          retention-days: 30

      # Mata kita selama pengembangan tanpa PC: tiga suasana dunia yang
      # dirender Editor tepat sebelum build (SceneShots.cs). Kalau folder
      # shots/ kosong, langkah ini diam-diam lewat (if-no-files-found).
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*.png
          if-no-files-found: ignore
          retention-days: 30

  # ------------------------------------------------------------
  release:
    name: Unggah ke Releases
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 'gh release create' memanggil git untuk menentukan remote/repo. Tanpa
      # checkout, job ini mati dengan:
      #   failed to run git: fatal: not a git repository
      # (kegagalan build CI ke-4, run 34926918799 -- APK-nya sendiri sudah jadi.)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # GERBAK LISENSI. Release di repo publik bisa diunduh siapa saja.
      # Kalau APK-nya memuat karakter Redistribution_Prohibited, itu redistribusi.
      - name: Tolak kalau repo publik dan VRM ikut ter-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VIS=$(gh repo view "$GITHUB_REPOSITORY" --json visibility -q .visibility)
          echo "visibilitas repo: $VIS | VRM dipakai: ${{ needs.build.outputs.vrmDipakai }}"
          if [ "$VIS" = "PUBLIC" ] && [ "${{ needs.build.outputs.vrmDipakai }}" = "true" ]; then
            echo "::error::Repo ini PUBLIK dan APK memuat karakter berlisensi Redistribution_Prohibited."
            echo "         Mempublikasikannya = redistribusi. Privatkan repo dulu, atau"
            echo "         build ulang dengan input ikutVrm=false."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: release

      - name: Buat/perbarui Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          APK=$(ls release/*.apk | head -1)
          if [ "${{ github.event_name }}" = "push" ]; then TAG="${GITHUB_REF_NAME}"
          else TAG="latest-dev"; fi
          if [ "$TAG" = "latest-dev" ]; then
            gh release delete latest-dev --yes --cleanup-tag 2>/dev/null || true
          fi
          gh release create "$TAG" "$APK" \
            --title "$TAG" \
            --notes "Build dari \`${GITHUB_SHA::7}\`. Karakter VRM: ${{ needs.build.outputs.vrmDipakai }}.

          Install: unduh APK, izinkan \"Install unknown apps\", buka file-nya.
          ARM64 / IL2CPP. PerfHud menyala -- ketuk sudut kanan-atas 3x untuk menyembunyikan." \
            $([ "$TAG" = "latest-dev" ] && echo --prerelease)
