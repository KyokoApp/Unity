# Utilitas: memindahkan PNG dari artifact 'screenshots' sebuah run build
# ke halaman Release, supaya bisa diunduh tanpa akses artifact Actions.
# Berjalan otomatis saat file ini di-push (atau manual via workflow_dispatch).
name: Lampirkan Screenshot ke Release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID run sumber artifact (mis. 35090571180)'
        required: false
        default: '35090571180'
      tag:
        description: 'Tag release tujuan (mis. v0.3.1-tahap5c)'
        required: false
        default: 'v0.3.3-tahap5e'
  push:
    branches: ['arena/01a0aa20-unity']
    paths: ['.github/workflows/attach-shots.yml']
jobs:
  attach:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - id: cfg
        env:
          IN_RUN: ${{ inputs.run_id }}
          IN_TAG: ${{ inputs.tag }}
        run: |
          echo "run_id=${IN_RUN:-35090571180}" >> "$GITHUB_OUTPUT"
          echo "tag=${IN_TAG:-v0.3.3-tahap5e}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Tunggu build sumber selesai
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run watch "${{ steps.cfg.outputs.run_id }}" --exit-status -R "$GITHUB_REPOSITORY"
      - uses: actions/download-artifact@v4
        with:
          name: screenshots
          run-id: ${{ steps.cfg.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: shots
      - run: ls -la shots/
      - name: Commit PNG ke branch (jalur git, bukan blob)
        run: |
          set -e
          mkdir -p shots-ci
          for f in shots/*.png; do cp "$f" "shots-ci/$(basename "$f" .png).png.bin"; done
          git rm -q shots-ci/*.png 2>/dev/null || true
          git config user.name "arena-ci"
          git config user.email "arena-ci@local"
          git add -f shots-ci/ # *.png di-.gitignore, paksa tambah
          if git diff --cached --quiet; then
            echo "tidak ada PNG baru, lewati commit"
          else
            git commit -m "shots CI dari run ${{ steps.cfg.outputs.run_id }}"
            git push
          fi
      - name: Unggah PNG ke Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.cfg.outputs.tag }}" shots/*.png --clobber -R "$GITHUB_REPOSITORY"
