name: probe
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - run: |
          set -e
          echo "RUNNER_OK $(uname -a)"
          echo "ANDROID_HOME=$ANDROID_HOME"; ls $ANDROID_HOME 2>/dev/null | head
          java -version 2>&1 | head -2
