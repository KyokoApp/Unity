name: Verifikasi (tanpa Unity)

# ============================================================
# Menjalankan SEMUA harness di _verify/ pada setiap push.
#
# Kenapa alur ini terpisah dari android-release.yml:
# build Unity itu berat (butuh lisensi + puluhan menit). Empat
# pemeriksaan di bawah ini tidak butuh Unity sama sekali dan
# selesai dalam ~1 menit, jadi layak jalan setiap kali ada push.
#
# Yang dijaga alur ini:
#   nunit      paritas C# vs JS asli, dan kebenaran mesh terrain
#   unitystub  skrip Unity masih terkompilasi (salah ketik/tipe/using)
#   terrain    survei dunia + retakan antar chunk + winding
#   shaders    Properties{} vs CBUFFER UnityPerMaterial (SRP Batcher)
#
# Yang TIDAK dijaga: apa pun yang butuh Unity sungguhan — kompilasi
# HLSL di GLES3/Vulkan, apakah UniVRM menghasilkan Avatar, dan
# apakah hasilnya terlihat benar. Itu hanya bisa diuji di Editor.
#
# PENTING — alur ini belum pernah dijalankan (dibuat dari sandbox
# tanpa akses GitHub). Kalau merah pada push pertama, baca log-nya;
# kemungkinan besar cuma soal versi .NET atau path.
# ============================================================

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pemeriksaan ini ringan; tidak perlu concurrency group sendiri.

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Tes NUnit (paritas + terrain mesh)
        working-directory: _verify/nunit
        run: dotnet test --nologo -c Release

      - name: Kompilasi skrip Unity melawan stub
        working-directory: _verify/unitystub
        run: dotnet build --nologo -c Release -warnaserror

      - name: Survei dunia + pengukuran mesh
        working-directory: _verify/terrain
        run: dotnet run -c Release

      # Pembaca PNG dipakai untuk MEMBUKTIKAN render, jadi logikanya ikut
      # diuji di sini: kalau dekode filter/sub/paeth salah, yang salah adalah
      # pengukurnya -- dan pengukur yang salah lebih mahal daripada tidak ada.
      - name: Selftest pengukur rata-rata PNG
        run: python3 _verify/shots/read_png_mean.py --selftest

      - name: Cek SRP Batcher shader
        run: python3 _verify/shaders/check_shader.py

      # Gerbang BARU, dan ia menggating. Unity menyimpan GUID aset di berkas
      # .meta, BUKAN di dalam berkas asetnya. .meta yang tidak di-repo berarti
      # GUID-nya diacak ulang setiap import -- dan setiap build CI adalah import
      # baru, jadi scene -> komponen dan material -> shader patah tanpa satu
      # baris error pun. Run v0.2.0-cel-fix20 membayarnya dengan satu jam lisensi:
      # tiga .mat di-commit tanpa .shader.meta -> screenshot editor jadi magenta
      # (225,55,233) dan APK akan menggambar material error. Selftest dulu supaya
      # penjaganya sendiri tidak busuk, baru periksa repo.
      - name: Setiap aset punya .meta (GUID stabil antar build)
        run: |
          python3 _verify/check_asset_meta.py --selftest
          git ls-files Assets | python3 _verify/check_asset_meta.py

      # Diagnostik BARU, sengaja TIDAK menggating (continue-on-error): sampai
      # terbukti stabil, kegagalan di sini boleh kuning, bukan merah -- tapi
      # pesannya tetap dibaca. Kegunaannya: harness _verify/unitystub melebur
      # SEMUA skrip jadi satu assembly, padahal Unity memisah per-.asmdef, jadi
      # kelas error "lolos di harness, gagal di build Unity 6-12 menit kemudian"
      # (RPG.Runtime.dll -> csc exitcode 1, run v0.2.0-cel-fix9) tidak pernah
      # terlihat di sini. Skrip ini menyusun ulang project sesuai .asmdef dan
      # mengompilasinya assembly demi assembly -- 60 detik, tanpa lisensi Unity.
      - name: Kompilasi per-assembly (cermin .asmdef)
        continue-on-error: true
        run: python3 _verify/asmdef/split_asmdefs.py

      # Retakan antar chunk dan winding sudah diverifikasi di dalam
      # _verify/terrain, tapi keduanya hanya DICETAK, tidak membuat
      # proses gagal. Langkah ini yang mengubahnya jadi gerbang:
      # kalau muncul kata "RETAK" atau "menghadap bawah: " bukan 0,
      # alurnya merah.
      - name: Gerbang retakan & winding
        working-directory: _verify/terrain
        run: |
          out=$(dotnet run -c Release)
          echo "$out"
          echo "$out" | grep -q "TIDAK ADA RETAKAN" || { echo "::error::ada retakan antar chunk"; exit 1; }
          bad=$(echo "$out" | grep -oP 'menghadap bawah: \K[0-9]+')
          [ "$bad" = "0" ] || { echo "::error::$bad segitiga menghadap bawah"; exit 1; }
          echo "retakan: 0 | winding salah: 0"
