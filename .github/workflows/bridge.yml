name: bridge
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Prepare REST pusher script
        run: |
          cat > ~/push_rest.py <<'PYEOF'
          import base64, glob, json, os, sys, urllib.request, urllib.parse
          tok, repo, branch, root = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          API = "https://api.github.com/repos/%s/git" % repo
          def call(method, url, data=None):
              body = json.dumps(data).encode() if data is not None else None
              req = urllib.request.Request(url, data=body, method=method, headers={
                  "Authorization": "Bearer " + tok, "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json"})
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())
          parent = []
          try:
              refs = call("GET", API + "/refs/heads/" + urllib.parse.quote(branch, safe=""))
              parent = [refs["object"]["sha"]]
          except Exception:
              parent = []
          files = sorted([f for f in glob.glob(root + "/**", recursive=True) if os.path.isfile(f)])
          tree = []
          for f in files:
              rel = os.path.relpath(f, root).replace(os.sep, "/")
              data = open(f, "rb").read()
              CH = 55 * 1024 * 1024
              parts = [data] if len(data) <= CH else [data[i:i+CH] for i in range(0, len(data), CH)]
              for idx, part in enumerate(parts):
                  name = rel if len(parts) == 1 else (rel + ".part%02d" % idx)
                  b = call("POST", API + "/blobs", {"content": base64.b64encode(part).decode(), "encoding": "base64"})
                  tree.append({"path": name, "mode": "100644", "type": "blob", "sha": b["sha"]})
                  print("blob ok:", name, len(part)); sys.stdout.flush()
          t = call("POST", API + "/trees", {"tree": tree})
          c = call("POST", API + "/commits", {"message": "bridge payload", "tree": t["sha"], "parents": parent})
          ref_path = API + "/refs/heads/" + urllib.parse.quote(branch, safe="")
          try:
              call("PATCH", ref_path, {"sha": c["sha"], "force": True})
          except Exception:
              call("POST", API + "/refs", {"ref": "refs/heads/" + branch, "sha": c["sha"]})
          print("PUSHED", c["sha"])
          PYEOF
          sed -i 's/^          //' ~/push_rest.py
          python3 -m py_compile ~/push_rest.py && echo PUSHER_OK
      - name: Gather binaries
        run: |
          set -ex
          mkdir -p ~/bridge/{godot,templates,fonts,debs} ~/templates_extract
          GV=4.5.2
          curl -sL --retry 5 --retry-delay 5 -o ~/bridge/godot/Godot_v${GV}_linux.x86_64.zip \
            "https://downloads.tuxfamily.org/godotengine/${GV}/Godot_v${GV}-stable_linux.x86_64.zip" \
            || curl -sL --retry 5 -o ~/bridge/godot/Godot_v${GV}_linux.x86_64.zip \
            "https://github.com/godotengine/godot/releases/download/${GV}-stable/Godot_v${GV}-stable_linux.x86_64.zip"
          curl -sL --retry 5 --retry-delay 5 -o /tmp/tpz.tpz \
            "https://downloads.tuxfamily.org/godotengine/${GV}/Godot_v${GV}-stable_export_templates.tpz" \
            || curl -sL --retry 5 -o /tmp/tpz.tpz \
            "https://github.com/godotengine/godot/releases/download/${GV}-stable/Godot_v${GV}-stable_export_templates.tpz"
          cd ~/templates_extract
          unzip -o -q /tmp/tpz.tpz "templates/android_debug.apk" "templates/android_release.apk" "templates/version.txt"
          mkdir -p ~/bridge/templates/4.5.2.stable
          cp templates/android_debug.apk templates/android_release.apk templates/version.txt ~/bridge/templates/4.5.2.stable/
          rm -rf /tmp/tpz.tpz ~/templates_extract
          echo "ANDROID_HOME=$ANDROID_HOME" | tee ~/bridge/DIAGNOSTIC.txt
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          PL=$(ls -d $ANDROID_HOME/platforms/*/ | sort -V | tail -1)
          echo "build-tools=$BT platform=$PL" | tee -a ~/bridge/DIAGNOSTIC.txt
          mkdir -p ~/sdkpack/android-sdk/{build-tools,platforms}
          cp -r "$BT" ~/sdkpack/android-sdk/build-tools/ && cp -r "$PL" ~/sdkpack/android-sdk/platforms/
          cp -r $ANDROID_HOME/platform-tools ~/sdkpack/android-sdk/ || true
          tar -C ~/sdkpack -czf ~/bridge/android-sdk.tgz android-sdk && rm -rf ~/sdkpack
          sudo apt-get update -qq
          PKGS="xvfb x11-xkb-utils xkb-data libgl1-mesa-dri libglx-mesa0 libegl-mesa0 libglapi-mesa mesa-vulkan-drivers libvulkan1 libglvnd0 libglx0 libgl1 libegl1 libdrm2 libx11-6 libx11-xcb1 libxcb1 libxcb-dri3-0 libxcb-present0 libxcb-randr0 libxcb-shm0 libxcb-sync1 libxcb-xfixes0 libxcb-glx0 libxau6 libxdmcp6 libbsd0 libmd0 libxshmfence1 libxxf86vm1 libxfixes3 libxdamage1 libxext6 libexpat1 libllvm15 libelf1 libsensors5 libxfont2 libfontenc1 libpixman-1-0 libxkbfile1 fonts-dejavu-core libxmuu1 xauth"
          cd ~/bridge/debs
          apt-get download $(apt-cache depends --recurse --no-recommends --no-suggests --no-conflicts --no-breaks --no-replaces --no-enhances $PKGS | grep -oP '^[a-zA-Z0-9][\w.+-]+' | sort -u) >> /tmp/debs.log 2>&1 || true
          cp /tmp/debs.log ~/bridge/debs-fetch.log || true
          for f in "ofl/baloo2/Baloo2%5Bwght%5D.ttf:Baloo2.ttf" "ofl/quicksand/Quicksand%5Bwght%5D.ttf:Quicksand.ttf"; do
            SRC="${f%%:*}"; DST="${f##*:}"
            gh api "repos/google/fonts/contents/$SRC" --jq '.content' | base64 -d > ~/bridge/fonts/"$DST" || echo "font $DST gagal" >> ~/bridge/DIAGNOSTIC.txt
          done
          du -sh ~/bridge >> ~/bridge/DIAGNOSTIC.txt
          cd ~/bridge && find . -type f -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256
      - name: REST push binaries to arena/bridge-assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -ex
          python3 ~/push_rest.py "$GH_TOKEN" "$GITHUB_REPOSITORY" "arena/bridge-assets" ~/bridge 2>&1 | tee /tmp/restpush.log
          sleep 15
          gh api "repos/$GITHUB_REPOSITORY/branches/arena%2Fbridge-assets" --jq .name
